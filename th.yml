rules:
  title: กฎของ InterChat
  body: กฎเหล่านี้ใช้ทุกที่ที่คุณใช้ InterChat ทั้งใน Hub และการโทร
  tabs:
    short: กฎ
    full: แนวทางฉบับเต็ม
    moderation: การดูแลเนื้อหา
  short: |-
    > **1.** ปฏิบัติต่อผู้อื่นด้วยความเคารพ ถ้าใครบอกให้หยุด ก็หยุด
    > **2.** อย่าโจมตีผู้อื่นเพราะตัวตนของเขา ห้ามใช้คำดูถูก
    > **3.** ห้ามข่มขู่ และอย่าแชร์ข้อมูลส่วนตัว
    > **4.** ห้ามเนื้อหาทางเพศ และห้ามเกี่ยวข้องกับผู้เยาว์เด็ดขาด
    > **5.** ห้ามสแปม และอย่าทำลายบทสนทนา
    > **6.** อย่าหลบเลี่ยงการแบนหรือส่งรายงานปลอม
    > **7.** ชื่อก็ต้องปฏิบัติตามกฎเหล่านี้ด้วย
  rules:
    title: กฎ
    commonSense: |
      ## ใช้สามัญสำนึก
      กฎเหล่านี้ครอบคลุมทุกสถานการณ์ที่เป็นไปได้ไม่ได้

      ถ้าเห็นชัดว่ามีการกระทำเพื่อทำร้าย ข่มขู่ คุกคาม ทำให้เป็นเรื่องทางเพศ หรือรบกวนผู้อื่นอย่างรุนแรง อย่าคิดว่าทำได้เพียงเพราะหาถ้อยคำที่ตรงกันในกฎเหล่านี้ไม่เจอ
    body: |
      ### 1. ปฏิบัติต่อผู้อื่นด้วยความเคารพ
      **หยอกล้อได้ แต่คุกคามไม่ได้**
      - การพูดเล่นและหยอกล้อไม่เป็นไร แต่อย่าทำให้กลายเป็นการดูถูกซ้ำ ๆ การคุกคาม หรือการจงใจทำให้ใครไม่พอใจ
      - ถ้าใครขอให้คุณหยุด ให้ **หยุด**
      - อย่ายั่วยุ เยาะเย้ย หรือโจมตีใครซ้ำ ๆ โดยเฉพาะหลังจากที่เขาขอให้คุณหยุดแล้ว
      ### 2. อย่าโจมตีผู้อื่นเพราะตัวตนของเขา
      **ไม่อนุญาตให้มีอคติรุนแรง**
      - อย่าโจมตี ดูหมิ่น หรือเหยียดหยามใครเพราะเชื้อชาติ ชาติพันธุ์ สัญชาติ ศาสนา เพศ รสนิยมทางเพศ ความพิการ หรือลักษณะที่คล้ายกัน
      - ไม่อนุญาตให้ใช้คำดูถูก แม้คุณจะอ้างว่าใช้ได้เพราะเกี่ยวกับตัวคุณเอง
      ### 3. ดูแลความปลอดภัยของผู้อื่น
      **ห้ามข่มขู่หรือพฤติกรรมอันตราย**
      - อย่าขู่ว่าจะทำร้าย ฆ่า หรือล่วงละเมิดทางเพศใคร
      - อย่าสนับสนุนให้ใครทำร้ายตัวเอง
      - อย่าสนับสนุนหรือช่วยใครในการ dox, swat, โจมตี หรือทำร้ายผู้อื่นในรูปแบบอื่น

      **อย่าแชร์ข้อมูลส่วนตัว**
      - อย่าโพสต์หรือขู่ว่าจะโพสต์ที่อยู่ เบอร์โทร ชื่อจริง ตำแหน่งที่อยู่ ที่อยู่ IP หรือข้อมูลส่วนตัวอื่นของใคร
      ### 4. ทำให้เนื้อหาทางเพศเหมาะสม
      **อย่าทำให้ผู้เยาว์เป็นเรื่องทางเพศ**
      - ไม่อนุญาตให้มีมุกตลก เรื่องเล่า ความคิดเห็น หรือบทสนทนาทางเพศที่เกี่ยวข้องกับผู้เยาว์
      - การ grooming การพยายามขอเนื้อหาทางเพศจากผู้เยาว์ หรือพฤติกรรมทางเพศอื่นที่มุ่งต่อผู้เยาว์ จะถูกจัดการอย่างจริงจังเป็นพิเศษ

      **อย่านำเนื้อหาทางเพศโจ่งแจ้งเข้ามาใน InterChat**
      - ห้าม sexting เล่นบทบาทสมมติทางเพศ ข้อความทางเพศโจ่งแจ้ง หรือเนื้อหาที่คล้ายกัน
      - การจีบทำได้เมื่อเขายินดี ถ้าใครไม่สนใจ ให้ **หยุด**
      ### 5. อย่าทำลายบทสนทนา
      **ห้ามสแปมหรือรบกวนโดยจงใจ**
      - อย่าส่งข้อความรัวจนท่วมแชท ส่งข้อความยาวเป็นกำแพง สแปมข้อความหรืออีโมจิ หรือจงใจทำให้บทสนทนาใช้งานไม่ได้
      ### 6. อย่าขัดขวางการดูแล
      **อย่าหลบเลี่ยงการดูแล**
      - อย่าใช้บัญชีอื่นหรือวิธีอื่นเพื่อเลี่ยงการแบนหรือข้อจำกัดที่มีผลอยู่

      **อย่าใช้ระบบรายงานในทางที่ผิด**
      - รายงานควรซื่อสัตย์และทำด้วยเจตนาดี
      - อย่าส่งรายงานปลอมเพื่อให้ใครถูกลงโทษ
      ### 7. ทำให้ตัวตนของคุณเหมาะสม
      **ชื่อก็ต้องปฏิบัติตามกฎด้วย**
      - ชื่อผู้ใช้ ชื่อเล่น ชื่อเซิร์ฟเวอร์ และชื่ออื่นที่แสดงผ่าน InterChat ต้องปฏิบัติตามกฎเหล่านี้

  enforcement: |
    ## การดูแลทำงานอย่างไร
    ผู้ดูแลพิจารณา **สิ่งที่เกิดขึ้น ความร้ายแรง ความจงใจ เป้าหมาย การหยุดเมื่อถูกขอ และประวัติล่าสุด**
    ### บันไดบทลงโทษคือ:
    ```เตือน → 6h → 24h → 7d → 14d → 30d → ถาวร```
    *บทลงโทษอาจไม่เรียงตามลำดับเสมอไป และมักขึ้นอยู่กับความร้ายแรงและบริบทของการละเมิด การละเมิดทั่วไปที่เก่ากว่า 90 วันโดยทั่วไปควรหมดอายุอัตโนมัติและไม่เพิ่มบทลงโทษ*

