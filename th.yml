    intro: โหวตของคุณช่วยให้เซิร์ฟเวอร์อื่นพบ InterChat มากขึ้น ขอบคุณที่สละเวลา 10 วินาที โหวตนี้ยังให้คุณเลือกได้เป็นเวลา 12 ชั่วโมงว่าจะจับคู่ใหม่หรือไม่หลังคู่สนทนาข้ามหรือวางสาย ตั้งค่าได้ที่ `/my settings`
    activeHeading: ใช้งานได้ในอีก 12 ชั่วโมงข้างหน้า
    emojiTitle: อีโมจิเซิร์ฟเวอร์
    emojiBody: ใช้อีโมจิจากเซิร์ฟเวอร์ใดก็ได้ในข้อความของคุณ
    roleTitle: ยศผู้โหวต
    roleBody: มอบให้ในเซิร์ฟเวอร์ซัพพอร์ตและถูกถอนเมื่อโหวตของคุณหมดอายุ ดังนั้นโหวตใหม่เพื่อเก็บไว้
    keepHeading: เป็นของคุณตลอดไป
    badgeTitle: แบดจ์ผู้โหวต
    badgeBody: ตอนนี้อยู่บนโปรไฟล์ InterChat ของคุณแล้ว
    freezeTitle: ฟรีซสตรีคหนึ่งครั้ง
    freezeBody: เก็บไว้สำหรับวันที่พลาด สูงสุด 2 ครั้ง
    supportButton: เซิร์ฟเวอร์ซัพพอร์ต
