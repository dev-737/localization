about:
  title: เกี่ยวกับ InterChat
  tagline: เซิร์ฟเวอร์ เชื่อมถึงกัน
  description: |-
    InterChat เชื่อมเซิร์ฟเวอร์ Discord เข้าด้วยกัน เพื่อให้คนจากต่างเซิร์ฟเวอร์พูดคุยกันได้

    **Hub** คือช่องที่ใช้ร่วมกันซึ่งมีหลายเซิร์ฟเวอร์โพสต์ข้อความ แชตไม่เคยเงียบ

    **การโทร** เชื่อมคุณกับอีกคนแบบส่วนตัว นานเท่าที่ทั้งสองฝ่ายต้องการ
  examples: |-
    > **/call**: คุยกับคนใหม่ได้ทันที
    > **/hub directory**: เข้าร่วม Hub แล้วแชตกับหลายเซิร์ฟเวอร์

  closingText: สร้างโดยทีม InterChat
  buttons:
    shardInfo: ข้อมูล Shard

botLanding:
  title: 'เซิร์ฟเวอร์ของคุณ เชื่อมถึงกันแล้ว :globe_icon: ไปคุยข้ามเซิร์ฟเวอร์กัน!'
  description: |
    สวัสดี ฉันคือ InterChat ฉันเชื่อมเซิร์ฟเวอร์นี้เข้ากับบทสนทนาทั่ว Discord

    ## 📞 โทร 1:1 และโทรกลุ่ม
    เริ่มการโทรแล้วเชื่อมกับอีกเซิร์ฟเวอร์ได้ในไม่กี่วินาที การโทรกลุ่มพาหลายเซิร์ฟเวอร์มาอยู่ในบทสนทนาเดียวกัน

    ใช้ `/call`, `/skip` และ `/hangup` ทุกการโทรช่วยให้คุณไต่อันดับใน `/leaderboard` ได้ 😎
  hubs: |
    ## :house_icon: Hub
    Hub คือชุมชน**ข้ามเซิร์ฟเวอร์**แบบถาวร เชื่อมหลายเซิร์ฟเวอร์เข้ากับพื้นที่ร่วมที่เปิดอยู่ตลอดแม้ไม่มีการสนทนา

    - :pin: **สร้าง:** `/hub create` - สร้าง Hub ของคุณเอง
    - :compass: **สำรวจ:** `/hub browse` - ค้นหา Hub สาธารณะ
    - :link_icon: **เชื่อมต่อ:** `/hub connect` - เข้าร่วม Hub ที่มีอยู่
    - ⚙️ **จัดการ:** `/hub manage` - เปิดการตั้งค่า Hub ของคุณ
    > ใช้ `/help` เพื่อดูคำสั่งทั้งหมด

  closing: |
    **พร้อมพบเซิร์ฟเวอร์อื่นแล้วหรือยัง? ลองโทร ค้นหา Hub หรือสร้าง Hub ของคุณเองด้านล่างได้เลย**

    -# สร้างด้วย :heart: โดย Sidequest Labs

