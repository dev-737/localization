about:
  title: เกี่ยวกับ InterChat
  tagline: Servers, connected.
  description: |-
    InterChat links Discord servers together, so people from different servers can talk to each other.

    **Hubs** are shared channels that many servers post in. The chat never goes quiet.

    **Calls** connect you privately with one other person, for as long as you both want.
  examples: |-
    > **/call**: talk to someone new right now
    > **/hub directory**: join a hub and chat with many servers
  closingText: Made by the InterChat team.
  buttons:
    shardInfo: Shard info
botLanding:
  title: Your server, connected. 🌐 Let's go cross-server!
  description: |
    Hi, I'm InterChat. With me, you can have conversations with people all around discord, all from the comfort of this server. Cool? Wait until you hear what I do:

    ## :telephone: 1:1 Calls & Group calls
    With the tap of one command you instantly get connected to another server, or multiple servers (in group calls!). Instant gratification at your fing

    Use `/call`, `/skip`, `/hangup`. And rank higher in `/leaderboard` :sunglasses:
  hubs: |
    ## 🏡 Hubs
    Hubs are persistent, **cross-server** communities. Connect several servers to one shared space that stays open between conversations.

    - 📌 **Create:** `/hub create` - make your own hub
    - 🧭 **Explore:** `/hub browse` - find public hubs
    - 🔗 **Connect:** `/hub connect` - join an existing hub
    - ⚙️ **Manage:** `/hub manage` - open your hub settings
    > Use `/help` to see every command.
  closing: |
    **What are you waiting for? Let me show you around! Type `/call` or `/hub directory` to get started.**

    -# Made with ❤️ by InterChat Development
