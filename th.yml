  create:
    title: Let's Get You Started!
    description: Pick a name, short-description, description & visibility for your hub.
    nextStep: You can connect this channel now or finish setup later.
    whatsAHub: |
      ## ❓ What's a Hub, anyway?
      Think of a Hub as a **room** created by someone.
      ## 🤨 Okay... how does this "room" work?
      In real life, a room needs people. In InterChat, multiple servers join the same Hub through a channel in each server.
      ## 🤔 "Joined"? What's actually connected?
      Let's zoom in.

      Imagine you're in **Server A**, and there's a channel called **#global** that's connected to a Hub.

      When you send a message in **#global**, that message is forwarded to every other server connected to the same Hub.

      Their messages are then forwarded back to your **#global** channel too.
      ## 👏 That's it.
      Hubs are a surprisingly simple concept.

      Let's get started!
