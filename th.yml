    > **แบดจ์ผู้โหวต**: แสดงบนโปรไฟล์ InterChat ของคุณ
    > **จับคู่อัตโนมัติส่วนตัว**: เลือกว่าจะให้จับคู่ใหม่หรือไม่หลังคู่สนทนาของคุณข้ามหรือวางสาย
