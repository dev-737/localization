about:
  title: InterChat के बारे में
  tagline: सर्वर, जुड़े हुए।
  description: |-
    InterChat Discord सर्वरों को आपस में जोड़ता है, ताकि अलग-अलग सर्वरों के लोग एक-दूसरे से बात कर सकें।

    **Hub** साझा चैनल होते हैं जिनमें कई सर्वर संदेश भेजते हैं। चैट कभी शांत नहीं होती।

    **कॉल** आपको किसी एक व्यक्ति से निजी तौर पर जोड़ते हैं, जब तक आप दोनों चाहें।
  examples: |-
    > **/call**: अभी किसी नए व्यक्ति से बात करें
    > **/hub directory**: किसी Hub से जुड़ें और कई सर्वरों से चैट करें

  closingText: InterChat टीम द्वारा बनाया गया।
  buttons:
    shardInfo: शार्ड जानकारी

botLanding:
  title: 'आपका सर्वर, जुड़ा हुआ। :globe_icon: चलिए क्रॉस-सर्वर चलें!'
  description: |
    नमस्ते, मैं InterChat हूँ। मैं इस सर्वर को पूरे Discord की बातचीत से जोड़ता हूँ।

    ## 📞 1:1 कॉल और ग्रुप कॉल
    कॉल शुरू करें और कुछ ही सेकंड में किसी दूसरे सर्वर से जुड़ें। ग्रुप कॉल कई सर्वरों को एक ही बातचीत में लाते हैं।

    `/call`, `/skip` और `/hangup` इस्तेमाल करें। हर कॉल आपको `/leaderboard` में ऊपर ले जा सकता है। 😎
  hubs: |
    ## :house_icon: Hubs
    Hub स्थायी, **क्रॉस-सर्वर** कम्युनिटी होते हैं। कई सर्वरों को एक साझा जगह से जोड़ें जो बातचीत के बीच भी खुली रहती है।

    - :pin: **बनाएँ:** `/hub create` - अपना खुद का Hub बनाएँ
    - :compass: **खोजें:** `/hub browse` - सार्वजनिक Hub ढूँढें
    - :link_icon: **जुड़ें:** `/hub connect` - किसी मौजूदा Hub से जुड़ें
    - ⚙️ **प्रबंधित करें:** `/hub manage` - अपनी Hub सेटिंग्स खोलें
    > सभी कमांड देखने के लिए `/help` इस्तेमाल करें।

  closing: |
    **किसी दूसरे सर्वर से मिलने के लिए तैयार हैं? कॉल आज़माएँ, कोई Hub खोजें या नीचे अपना खुद का बनाएँ।**

    -# Sidequest Labs द्वारा :heart: से बनाया गया

