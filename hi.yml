rules:
  title: InterChat के नियम
  body: ये नियम InterChat इस्तेमाल करने की हर जगह लागू होते हैं, Hub और कॉल दोनों में।
  tabs:
    short: नियम
    full: पूरे दिशानिर्देश
    moderation: मॉडरेशन
  short: |-
    > **1.** लोगों के साथ सम्मान से पेश आएँ। अगर कोई रुकने को कहे, तो रुक जाएँ।
    > **2.** लोगों पर उनकी पहचान के लिए हमला न करें। अपमानजनक शब्द नहीं।
    > **3.** कोई धमकी नहीं, और निजी जानकारी साझा न करें।
    > **4.** कोई यौन सामग्री नहीं। नाबालिगों से जुड़ी तो कभी नहीं।
    > **5.** कोई स्पैम नहीं, और बातचीत न बिगाड़ें।
    > **6.** बैन से बचने की कोशिश या फ़र्ज़ी रिपोर्ट न भेजें।
    > **7.** नामों को भी इन नियमों का पालन करना होगा।
  rules:
    title: नियम
    commonSense: |
      ## समझदारी से काम लें
      ये नियम हर संभव स्थिति को कवर नहीं कर सकते।

      अगर कुछ साफ़ तौर पर किसी को चोट पहुँचाने, धमकाने, परेशान करने, यौन रूप से पेश करने या गंभीर रूप से बाधित करने के लिए किया जा रहा है, तो यह मत मानें कि वह इसलिए ठीक है कि आपको इन नियमों में सटीक शब्द नहीं मिले।
    body: |
      ### 1. लोगों के साथ सम्मान से पेश आएँ
      **हँसी-मज़ाक ठीक है। उत्पीड़न नहीं।**
      - मज़ाक और छेड़छाड़ ठीक है, लेकिन इसे बार-बार अपमान, उत्पीड़न या किसी को जानबूझकर परेशान करने की कोशिश में न बदलें।
      - अगर कोई आपसे रुकने को कहे, तो **रुक जाएँ**।
      - किसी को बार-बार न उकसाएँ, न उसका मज़ाक उड़ाएँ, न उस पर हमला करें, खासकर तब जब उसने आपसे रुकने को कहा हो।
      ### 2. लोगों पर उनकी पहचान के लिए हमला न करें
      **कट्टरता की अनुमति नहीं है।**
      - किसी की नस्ल, जातीयता, राष्ट्रीयता, धर्म, लिंग, यौन रुझान, विकलांगता या ऐसी ही विशेषताओं के कारण उस पर हमला, उसका अपमान या अनादर न करें।
      - अपमानजनक शब्दों की अनुमति नहीं है, भले ही आप दावा करें कि आप उन्हें इस्तेमाल कर सकते हैं क्योंकि वे आप पर लागू होते हैं।
      ### 3. लोगों को सुरक्षित रखें
      **कोई धमकी या खतरनाक व्यवहार नहीं।**
      - किसी को चोट पहुँचाने, मारने या यौन हमला करने की धमकी न दें।
      - किसी को खुद को नुकसान पहुँचाने के लिए न उकसाएँ।
      - किसी को डॉक्सिंग, स्वैटिंग, हमला या किसी और तरह से दूसरे को नुकसान पहुँचाने के लिए न उकसाएँ और न इसमें मदद करें।

      **निजी जानकारी साझा न करें।**
      - किसी का पता, फ़ोन नंबर, असली नाम, लोकेशन, IP पता या अन्य निजी जानकारी न पोस्ट करें, न पोस्ट करने की धमकी दें।
      ### 4. यौन सामग्री को उचित रखें
      **नाबालिगों को यौन रूप में पेश न करें।**
      - नाबालिगों से जुड़े यौन मज़ाक, कहानियाँ, टिप्पणियाँ या बातचीत की अनुमति नहीं है।
      - ग्रूमिंग, किसी नाबालिग से यौन सामग्री पाने की कोशिश, या नाबालिगों की ओर निर्देशित अन्य यौन व्यवहार को विशेष रूप से गंभीरता से लिया जाता है।

      **स्पष्ट यौन सामग्री को InterChat से बाहर रखें।**
      - कोई सेक्सटिंग, यौन रोलप्ले, स्पष्ट यौन संदेश या ऐसी ही सामग्री नहीं।
      - फ़्लर्ट करना तब ठीक है जब उसका स्वागत हो। अगर कोई दिलचस्पी नहीं रखता, तो **रुक जाएँ**।
      ### 5. बातचीत न बिगाड़ें
      **कोई स्पैम या जानबूझकर बाधा नहीं।**
      - चैट में फ़्लड न करें, टेक्स्ट की विशाल दीवारें न भेजें, संदेश या इमोजी का स्पैम न करें, और जानबूझकर किसी बातचीत को बेकार न बनाएँ।
      ### 6. मॉडरेशन में बाधा न डालें
      **मॉडरेशन से बचने की कोशिश न करें।**
      - किसी सक्रिय बैन या पाबंदी से बचने के लिए दूसरे खाते या किसी और तरीके का इस्तेमाल न करें।

      **रिपोर्ट सिस्टम का दुरुपयोग न करें।**
      - रिपोर्ट ईमानदार और नेकनीयती से की जानी चाहिए।
      - किसी को सज़ा दिलाने के लिए फ़र्ज़ी रिपोर्ट न करें।
      ### 7. अपनी पहचान उचित रखें
      **नामों को भी नियमों का पालन करना होगा।**
      - InterChat के ज़रिए दिखने वाले यूज़रनेम, निकनेम, सर्वर के नाम और अन्य नाम इन नियमों का पालन करें।

  enforcement: |
    ## मॉडरेशन कैसे काम करता है
    मॉडरेटर देखते हैं कि **क्या हुआ, यह कितना गंभीर था, क्या यह जानबूझकर था, यह किसके खिलाफ़ था, कहने पर व्यक्ति रुका या नहीं, और उसका हालिया इतिहास।**
    ### सज़ा की सीढ़ी यह है:
    ```चेतावनी → 6h → 24h → 7d → 14d → 30d → स्थायी```
    *सज़ाएँ हमेशा क्रमवार नहीं होतीं और अक्सर उल्लंघन की गंभीरता और संदर्भ पर निर्भर करती हैं। 90 दिन से पुराने सामान्य उल्लंघन आम तौर पर अपने आप समाप्त हो जाने चाहिए और सज़ा नहीं बढ़ानी चाहिए।*

