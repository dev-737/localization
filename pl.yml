about:
  title: O InterChat
  tagline: Serwery, połączone.
  description: |-
    InterChat łączy serwery Discord, dzięki czemu osoby z różnych serwerów mogą ze sobą rozmawiać.

    **Huby** to wspólne kanały, w których pisze wiele serwerów. Czat nigdy nie cichnie.

    **Rozmowy** łączą Cię prywatnie z jedną inną osobą, tak długo, jak oboje chcecie.
  examples: |-
    > **/call**: porozmawiaj z kimś nowym od razu
    > **/hub directory**: dołącz do huba i rozmawiaj z wieloma serwerami

  closingText: Stworzone przez zespół InterChat.
  buttons:
    shardInfo: Informacje o shardach

botLanding:
  title: 'Twój serwer, połączony. :globe_icon: Czas na rozmowy między serwerami!'
  description: |
    Cześć, jestem InterChat. Łączę ten serwer z rozmowami na całym Discordzie.

    ## 📞 Rozmowy 1:1 i grupowe
    Rozpocznij rozmowę i połącz się z innym serwerem w kilka sekund. Rozmowy grupowe wprowadzają kilka serwerów do tej samej konwersacji.

    Używaj `/call`, `/skip` i `/hangup`. Każda rozmowa może podnieść Cię w `/leaderboard`. 😎
  hubs: |
    ## :house_icon: Huby
    Huby to stałe społeczności **ponad serwerami**. Połącz kilka serwerów z jedną wspólną przestrzenią, która pozostaje otwarta między rozmowami.

    - :pin: **Utwórz:** `/hub create` - załóż własny hub
    - :compass: **Odkrywaj:** `/hub browse` - znajdź publiczne huby
    - :link_icon: **Połącz:** `/hub connect` - dołącz do istniejącego huba
    - ⚙️ **Zarządzaj:** `/hub manage` - otwórz ustawienia swojego huba
    > Użyj `/help`, aby zobaczyć wszystkie polecenia.

  closing: |
    **Gotowy(-a) poznać inny serwer? Wypróbuj rozmowę, odkryj hub albo utwórz własny poniżej.**

    -# Stworzone z :heart: przez Sidequest Labs

