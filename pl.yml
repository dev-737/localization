rules:
  title: Zasady InterChat
  body: Te zasady obowiązują wszędzie, gdzie używasz InterChat, zarówno w hubach, jak i w rozmowach.
  tabs:
    short: Zasady
    full: Pełne wytyczne
    moderation: Moderacja
  short: |-
    > **1.** Traktuj ludzi z szacunkiem. Jeśli ktoś mówi „stop”, przestań.
    > **2.** Nie atakuj ludzi za to, kim są. Żadnych obelg.
    > **3.** Żadnych gróźb i nie udostępniaj prywatnych informacji.
    > **4.** Żadnych treści seksualnych. Nigdy z udziałem nieletnich.
    > **5.** Żadnego spamu i nie psuj rozmowy.
    > **6.** Nie omijaj banów i nie wysyłaj fałszywych zgłoszeń.
    > **7.** Nazwy też muszą przestrzegać tych zasad.
  rules:
    title: Zasady
    commonSense: |
      ## Kieruj się zdrowym rozsądkiem
      Te zasady nie mogą obejmować każdej możliwej sytuacji.

      Jeśli coś jest wyraźnie robione, by skrzywdzić, zastraszyć, nękać, seksualizować lub poważnie zakłócać komuś życie, nie zakładaj, że jest dozwolone tylko dlatego, że nie znajdujesz dokładnego sformułowania w tych zasadach.
    body: |
      ### 1. Traktuj ludzi z szacunkiem
      **Żarty są dozwolone. Nękanie nie.**
      - Żarty i przekomarzanie się są w porządku, ale nie zamieniaj ich w powtarzane obelgi, nękanie ani celowe próby zdenerwowania kogoś.
      - Jeśli ktoś prosi, żebyś przestał, **przestań**.
      - Nie prowokuj, nie wyśmiewaj i nie atakuj kogoś wielokrotnie, zwłaszcza po tym, jak poprosił, żebyś przestał.
      ### 2. Nie atakuj ludzi za to, kim są
      **Nietolerancja jest niedozwolona.**
      - Nie atakuj, nie obrażaj i nie poniżaj nikogo z powodu rasy, pochodzenia etnicznego, narodowości, religii, płci, seksualności, niepełnosprawności ani podobnych cech.
      - Obelgi są niedozwolone, nawet jeśli twierdzisz, że możesz ich używać, bo dotyczą Ciebie.
      ### 3. Dbaj o bezpieczeństwo ludzi
      **Żadnych gróźb ani niebezpiecznych zachowań.**
      - Nie groź, że kogoś skrzywdzisz, zabijesz lub napadniesz seksualnie.
      - Nie zachęcaj nikogo do robienia sobie krzywdy.
      - Nie zachęcaj i nie pomagaj nikomu w doxingu, swattingu, atakowaniu ani innym krzywdzeniu innej osoby.

      **Nie udostępniaj prywatnych informacji.**
      - Nie publikuj ani nie groź publikacją czyjegoś adresu, numeru telefonu, prawdziwego imienia i nazwiska, lokalizacji, adresu IP ani innych prywatnych informacji.
      ### 4. Dbaj o stosowność treści seksualnych
      **Nie seksualizuj nieletnich.**
      - Żarty, historie, komentarze ani rozmowy seksualne z udziałem nieletnich są niedozwolone.
      - Grooming, próby uzyskania treści seksualnych od nieletniego i inne zachowania seksualne skierowane do nieletnich traktujemy ze szczególną powagą.

      **Nie wprowadzaj do InterChat wyraźnych treści seksualnych.**
      - Żadnego sekstingu, seksualnego odgrywania ról, dosłownych wiadomości seksualnych ani podobnych treści.
      - Flirtowanie jest w porządku, gdy jest mile widziane. Jeśli ktoś nie jest zainteresowany, **przestań**.
      ### 5. Nie psuj rozmowy
      **Żadnego spamu ani celowego zakłócania.**
      - Nie zalewaj czatów, nie wysyłaj ogromnych ścian tekstu, nie spamuj wiadomościami ani emoji i nie uniemożliwiaj celowo rozmowy.
      ### 6. Nie utrudniaj moderacji
      **Nie omijaj moderacji.**
      - Nie używaj innego konta ani innej metody, by obejść aktywny ban lub ograniczenie.

      **Nie nadużywaj systemu zgłoszeń.**
      - Zgłoszenia powinny być uczciwe i składane w dobrej wierze.
      - Nie składaj fałszywych zgłoszeń, by ktoś został ukarany.
      ### 7. Dbaj o stosowność swojej tożsamości
      **Nazwy też muszą przestrzegać zasad.**
      - Nazwy użytkowników, pseudonimy, nazwy serwerów i inne nazwy wyświetlane w InterChat muszą przestrzegać tych zasad.

  enforcement: |
    ## Jak działa moderacja
    Moderatorzy biorą pod uwagę **co się stało, jak poważne to było, czy było zamierzone, przeciwko komu było skierowane, czy osoba przestała na prośbę oraz jej niedawną historię.**
    ### Drabina kar wygląda tak:
    ```Ostrzeżenie → 6h → 24h → 7d → 14d → 30d → Permanentnie```
    *Kary nie zawsze muszą być liniowe i często zależą od wagi oraz kontekstu naruszenia. Zwykłe wykroczenia starsze niż 90 dni powinny co do zasady wygasać automatycznie i nie zwiększać kary.*

