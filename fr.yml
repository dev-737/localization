rules:
  title: Règles d'InterChat
  body: Ces règles s'appliquent partout où tu utilises InterChat, dans les hubs comme dans les appels.
  tabs:
    short: Les règles
    full: Règles complètes
    moderation: Modération
  short: |-
    > **1.** Traite les gens avec respect. Si quelqu'un dit stop, arrête.
    > **2.** N'attaque pas les gens pour ce qu'ils sont. Pas d'insultes discriminatoires.
    > **3.** Pas de menaces, et ne partage pas d'informations privées.
    > **4.** Pas de contenu sexuel. Jamais impliquant des mineurs.
    > **5.** Pas de spam, et ne gâche pas la conversation.
    > **6.** Ne contourne pas les bannissements et n'envoie pas de faux signalements.
    > **7.** Les noms doivent aussi respecter ces règles.
  rules:
    title: Les règles
    commonSense: |
      ## Utilise ton bon sens
      Ces règles ne peuvent pas couvrir toutes les situations possibles.

      Si quelque chose est manifestement fait pour blesser, menacer, harceler, sexualiser ou perturber gravement une autre personne, ne pars pas du principe que c'est autorisé simplement parce que tu ne trouves pas la formulation exacte dans ces règles.
    body: |
      ### 1. Traite les gens avec respect
      **Le chambrage est permis. Le harcèlement non.**
      - Plaisanter et chambrer, c'est bien, mais n'en fais pas des insultes répétées, du harcèlement ou des tentatives délibérées de contrarier quelqu'un.
      - Si quelqu'un te demande d'arrêter, **arrête**.
      - Ne provoque, ne te moque et n'attaque pas quelqu'un de façon répétée, surtout après qu'il t'a demandé d'arrêter.
      ### 2. N'attaque pas les gens pour ce qu'ils sont
      **L'intolérance n'est pas permise.**
      - N'attaque pas, n'insulte pas et ne rabaisse pas quelqu'un à cause de sa race, son origine ethnique, sa nationalité, sa religion, son genre, sa sexualité, son handicap ou des caractéristiques similaires.
      - Les insultes discriminatoires ne sont pas permises, même si tu prétends pouvoir les utiliser parce qu'elles s'appliquent à toi.
      ### 3. Protège les gens
      **Pas de menaces ni de comportements dangereux.**
      - Ne menace pas de blesser, de tuer ou d'agresser sexuellement quelqu'un.
      - N'encourage personne à se faire du mal.
      - N'encourage pas et n'aide pas quelqu'un à faire du doxing, du swatting, à attaquer ou à nuire de toute autre manière à une autre personne.

      **Ne partage pas d'informations privées.**
      - Ne publie pas et ne menace pas de publier l'adresse, le numéro de téléphone, le vrai nom, la localisation, l'adresse IP ou d'autres informations privées de quelqu'un.
      ### 4. Garde un contenu sexuel approprié
      **Ne sexualise pas les mineurs.**
      - Les blagues, histoires, commentaires ou conversations sexuels impliquant des mineurs ne sont pas permis.
      - Le grooming, la tentative d'obtenir du contenu sexuel d'un mineur ou tout autre comportement sexuel dirigé vers des mineurs est traité avec une gravité particulière.

      **Garde le contenu sexuel explicite hors d'InterChat.**
      - Pas de sexting, de jeu de rôle sexuel, de messages sexuels explicites ou de contenu similaire.
      - Flirter, c'est bien quand c'est bienvenu. Si quelqu'un n'est pas intéressé, **arrête**.
      ### 5. Ne gâche pas la conversation
      **Pas de spam ni de perturbation délibérée.**
      - N'inonde pas les discussions, n'envoie pas d'énormes pavés de texte, ne spamme pas de messages ou d'émojis et ne rends pas volontairement une conversation inutilisable.
      ### 6. N'entrave pas la modération
      **Ne contourne pas la modération.**
      - N'utilise pas un autre compte ou une autre méthode pour contourner un bannissement ou une restriction actifs.

      **N'abuse pas du système de signalement.**
      - Les signalements doivent être honnêtes et faits de bonne foi.
      - Ne fais pas de faux signalements pour faire punir quelqu'un.
      ### 7. Garde une identité appropriée
      **Les noms doivent aussi respecter les règles.**
      - Les noms d'utilisateur, pseudos, noms de serveur et autres noms affichés via InterChat doivent respecter ces règles.

  enforcement: |
    ## Comment fonctionne la modération
    Les modérateurs examinent **ce qui s'est passé, la gravité, si c'était intentionnel, qui était visé, si la personne s'est arrêtée quand on le lui a demandé, et son historique récent.**
    ### L'échelle des sanctions est :
    ```Avertissement → 6h → 24h → 7j → 14j → 30j → Permanent```
    *Les sanctions ne sont pas toujours linéaires et dépendent souvent de la gravité et du contexte de l'infraction. Les infractions normales de plus de 90 jours devraient en général expirer automatiquement et ne pas aggraver une sanction.*

