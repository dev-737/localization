about:
  title: À propos d'InterChat
  tagline: Des serveurs, connectés.
  description: |-
    InterChat relie des serveurs Discord entre eux, pour que les membres de serveurs différents puissent discuter ensemble.

    Les **hubs** sont des salons partagés où de nombreux serveurs écrivent. Le chat ne s'arrête jamais.

    Les **appels** te mettent en relation en privé avec une autre personne, aussi longtemps que vous le souhaitez tous les deux.
  examples: |-
    > **/call** : parle tout de suite à quelqu'un de nouveau
    > **/hub directory** : rejoins un hub et discute avec de nombreux serveurs

  closingText: Créé par l'équipe InterChat.
  buttons:
    shardInfo: Infos sur les shards

botLanding:
  title: 'Ton serveur, connecté. :globe_icon: Direction l''inter-serveurs !'
  description: |
    Salut, je suis InterChat. Je relie ce serveur aux conversations de tout Discord.

    ## 📞 Appels en 1:1 et en groupe
    Lance un appel et connecte-toi à un autre serveur en quelques secondes. Les appels de groupe réunissent plusieurs serveurs dans la même conversation.

    Utilise `/call`, `/skip` et `/hangup`. Chaque appel peut te faire monter dans le `/leaderboard`. 😎
  hubs: |
    ## :house_icon: Hubs
    Les hubs sont des communautés **inter-serveurs** permanentes. Relie plusieurs serveurs à un même espace qui reste ouvert entre les conversations.

    - :pin: **Créer :** `/hub create` - crée ton propre hub
    - :compass: **Explorer :** `/hub browse` - trouve des hubs publics
    - :link_icon: **Connecter :** `/hub connect` - rejoins un hub existant
    - ⚙️ **Gérer :** `/hub manage` - ouvre les paramètres de ton hub
    > Utilise `/help` pour voir toutes les commandes.

  closing: |
    **Prêt à rencontrer un autre serveur ? Essaie un appel, découvre un hub ou crée le tien ci-dessous.**

    -# Fait avec :heart: par Sidequest Labs

