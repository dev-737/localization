about:
  title: About InterChat
  tagline: Servers, connected.
  description: |-
    InterChat links Discord servers together, so people from different servers can talk to each other.

    **Hubs** are shared channels that many servers post in. The chat never goes quiet.

    **Calls** connect you privately with one other person, for as long as you both want.
  examples: |-
    > **/call**: talk to someone new right now
    > **/hub directory**: join a hub and chat with many servers

  closingText: Made by the InterChat team.
  buttons:
    shardInfo: Shard info

botLanding:
  title: 'Your server, connected. :globe_icon: Let''s go cross-server!'
  description: |
    Hi, I'm InterChat. I connect this server to conversations across Discord.

    ## 📞 1:1 calls and group calls
    Start a call and connect with another server in seconds. Group calls bring several servers into the same conversation.

    Use `/call`, `/skip`, and `/hangup`. Every call can move you up `/leaderboard`. 😎
  hubs: |
    ## :house_icon: Hubs
    Hubs are persistent, **cross-server** communities. Connect several servers to one shared space that stays open between conversations.

    - :pin: **Create:** `/hub create` - make your own hub
    - :compass: **Explore:** `/hub browse` - find public hubs
    - :link_icon: **Connect:** `/hub connect` - join an existing hub
    - ⚙️ **Manage:** `/hub manage` - open your hub settings
    > Use `/help` to see every command.

  closing: |
    **Ready to meet another server? Try a call, discover a hub, or create your own below.**

    -# Made with :heart: by InterChat Development

