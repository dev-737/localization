rules:
  title: InterChat Rules
  body: These rules apply everywhere you use InterChat, in hubs and calls alike.
  tabs:
    short: The rules
    full: Full guidelines
    moderation: Moderation
  short: |-
    > **1.** Treat people with respect. If someone says stop, stop.
    > **2.** Don't attack people for who they are. No slurs.
    > **3.** No threats, and don't share private information.
    > **4.** No sexual content. Never involving minors.
    > **5.** No spam, and don't ruin the conversation.
    > **6.** Don't evade bans or send fake reports.
    > **7.** Names must follow these rules too.
  rules:
    title: The Rules
    commonSense: |
      ## Use common sense
      These rules can't cover every possible situation.

      If something is obviously being done to hurt, threaten, harass, sexualize, or seriously disrupt another person, don't assume it's allowed just because you can't find the exact wording in these rules.
    body: |
      ### 1. Treat people with respect
      **Banter is allowed. Harassment isn't.**
      - Joking and banter are fine, but don't turn them into repeated insults, harassment, or deliberate attempts to upset someone.
      - If someone asks you to stop, **stop**.
      - Don't repeatedly provoke, mock, or attack someone, especially after they've asked you to stop.
      ### 2. Don't attack people for who they are
      **Bigotry is not allowed.**
      - Don't attack, insult, or degrade someone because of their race, ethnicity, nationality, religion, gender, sexuality, disability, or similar traits.
      - Slurs aren't allowed, even if you claim you can use them because they apply to you.
      ### 3. Keep people safe
      **No threats or dangerous behavior.**
      - Don't threaten to hurt, kill, or sexually assault someone.
      - Don't encourage someone to hurt themselves.
      - Don't encourage or help someone dox, swat, attack, or otherwise harm another person.

      **Don't share private information.**
      - Don't post or threaten to post someone's address, phone number, real name, location, IP address, or other private information.
      ### 4. Keep sexual content appropriate
      **Don't sexualize minors.**
      - Sexual jokes, stories, comments, or conversations involving minors aren't allowed.
      - Grooming, attempting to obtain sexual content from a minor, or other sexual behavior directed at minors is treated especially seriously.

      **Keep explicit sexual content out of InterChat.**
      - No sexting, sexual roleplay, graphic sexual messages, or similar content.
      - Flirting is fine when it's welcome. If someone isn't interested, **stop**.
      ### 5. Don't ruin the conversation
      **No spam or deliberate disruption.**
      - Don't flood chats, send huge walls of text, spam messages or emojis, or intentionally make a conversation unusable.
      ### 6. Don't interfere with moderation
      **Don't evade moderation.**
      - Don't use another account or another method to get around an active ban or restriction.

      **Don't abuse the report system.**
      - Reports should be honest and made in good faith.
      - Don't make fake reports to get someone punished.
      ### 7. Keep your identity appropriate
      **Names must follow the rules too.**
      - Usernames, nicknames, server names, and other names shown through InterChat must follow these rules.

  enforcement: |
    ## How moderation works
    Moderators look at **what happened, how serious it was, whether it was intentional, who it was directed at, whether the person stopped when asked, and their recent history.**
    ### The punishment ladder is:
    ```Warn → 6h → 24h → 7d → 14d → 30d → Permanent```
    *Punishments may not always be linear, and often depend on the severity and context of the violation. Normal infractions older than 90 days should generally automatically expire and not increase a punishment.*

