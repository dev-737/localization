rules:
  title: Regras do InterChat
  body: Estas regras valem em qualquer lugar onde você usa o InterChat, tanto em hubs quanto em chamadas.
  tabs:
    short: As regras
    full: Diretrizes completas
    moderation: Moderação
  short: |-
    > **1.** Trate as pessoas com respeito. Se alguém pedir para parar, pare.
    > **2.** Não ataque as pessoas por quem elas são. Sem ofensas.
    > **3.** Sem ameaças, e não compartilhe informações privadas.
    > **4.** Sem conteúdo sexual. Nunca envolvendo menores.
    > **5.** Sem spam, e não estrague a conversa.
    > **6.** Não burle banimentos nem envie denúncias falsas.
    > **7.** Os nomes também devem seguir estas regras.
  rules:
    title: As regras
    commonSense: |
      ## Use o bom senso
      Estas regras não conseguem cobrir todas as situações possíveis.

      Se algo é claramente feito para ferir, ameaçar, assediar, sexualizar ou perturbar gravemente outra pessoa, não presuma que é permitido só porque você não encontra a redação exata nestas regras.
    body: |
      ### 1. Trate as pessoas com respeito
      **Brincadeira é permitida. Assédio não.**
      - Brincar e zoar é normal, mas não transforme isso em insultos repetidos, assédio ou tentativas deliberadas de chatear alguém.
      - Se alguém pedir para você parar, **pare**.
      - Não provoque, ridicularize nem ataque alguém repetidamente, principalmente depois de a pessoa pedir para você parar.
      ### 2. Não ataque as pessoas por quem elas são
      **Intolerância não é permitida.**
      - Não ataque, insulte nem degrade alguém por raça, etnia, nacionalidade, religião, gênero, sexualidade, deficiência ou características semelhantes.
      - Ofensas não são permitidas, mesmo que você alegue poder usá-las porque se aplicam a você.
      ### 3. Mantenha as pessoas seguras
      **Sem ameaças ou comportamento perigoso.**
      - Não ameace ferir, matar ou agredir sexualmente alguém.
      - Não incentive ninguém a se machucar.
      - Não incentive nem ajude alguém a fazer doxing, swatting, atacar ou prejudicar outra pessoa de qualquer forma.

      **Não compartilhe informações privadas.**
      - Não poste nem ameace postar o endereço, telefone, nome real, localização, endereço IP ou outras informações privadas de alguém.
      ### 4. Mantenha o conteúdo sexual adequado
      **Não sexualize menores.**
      - Piadas, histórias, comentários ou conversas sexuais envolvendo menores não são permitidos.
      - Aliciamento, tentativa de obter conteúdo sexual de um menor ou outro comportamento sexual dirigido a menores é tratado com especial gravidade.

      **Mantenha conteúdo sexual explícito fora do InterChat.**
      - Sem sexting, roleplay sexual, mensagens sexuais gráficas ou conteúdo semelhante.
      - Flertar é normal quando é bem-vindo. Se alguém não estiver interessado, **pare**.
      ### 5. Não estrague a conversa
      **Sem spam ou perturbação deliberada.**
      - Não inunde chats, não envie enormes paredes de texto, não faça spam de mensagens ou emojis nem torne uma conversa inutilizável de propósito.
      ### 6. Não atrapalhe a moderação
      **Não burle a moderação.**
      - Não use outra conta ou outro método para contornar um banimento ou restrição ativos.

      **Não abuse do sistema de denúncias.**
      - As denúncias devem ser honestas e feitas de boa-fé.
      - Não faça denúncias falsas para que alguém seja punido.
      ### 7. Mantenha sua identidade adequada
      **Os nomes também devem seguir as regras.**
      - Nomes de usuário, apelidos, nomes de servidor e outros nomes exibidos pelo InterChat devem seguir estas regras.

  enforcement: |
    ## Como funciona a moderação
    Os moderadores consideram **o que aconteceu, a gravidade, se foi intencional, contra quem foi dirigido, se a pessoa parou quando pediram e o histórico recente.**
    ### A escada de punições é:
    ```Aviso → 6h → 24h → 7d → 14d → 30d → Permanente```
    *As punições nem sempre são lineares e muitas vezes dependem da gravidade e do contexto da violação. Infrações normais com mais de 90 dias geralmente devem expirar automaticamente e não aumentar uma punição.*

