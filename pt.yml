about:
  title: Sobre o InterChat
  tagline: Servidores, conectados.
  description: |-
    O InterChat liga servidores do Discord para que pessoas de servidores diferentes possam conversar entre si.

    **Hubs** são canais compartilhados em que muitos servidores participam. O chat nunca fica quieto.

    **Chamadas** conectam você em particular com outra pessoa, pelo tempo que vocês dois quiserem.
  examples: |-
    > **/call**: converse com alguém novo agora mesmo
    > **/hub directory**: entre em um hub e converse com vários servidores

  closingText: Feito pela equipe do InterChat.
  buttons:
    shardInfo: Informações de shard

botLanding:
  title: 'Seu servidor, conectado. :globe_icon: Bora conversar entre servidores!'
  description: |
    Oi, eu sou o InterChat. Eu conecto este servidor a conversas de todo o Discord.

    ## 📞 Chamadas 1:1 e em grupo
    Inicie uma chamada e conecte-se a outro servidor em segundos. Chamadas em grupo reúnem vários servidores na mesma conversa.

    Use `/call`, `/skip` e `/hangup`. Cada chamada pode te levar para cima no `/leaderboard`. 😎
  hubs: |
    ## :house_icon: Hubs
    Hubs são comunidades **entre servidores** e permanentes. Conecte vários servidores a um espaço compartilhado que continua aberto entre as conversas.

    - :pin: **Criar:** `/hub create` - crie o seu próprio hub
    - :compass: **Explorar:** `/hub browse` - encontre hubs públicos
    - :link_icon: **Conectar:** `/hub connect` - entre em um hub existente
    - ⚙️ **Gerenciar:** `/hub manage` - abra as configurações do seu hub
    > Use `/help` para ver todos os comandos.

  closing: |
    **Pronto para conhecer outro servidor? Experimente uma chamada, descubra um hub ou crie o seu abaixo.**

    -# Feito com :heart: pela Sidequest Labs

