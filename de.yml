about:
  title: Über InterChat
  tagline: Server, verbunden.
  description: |-
    InterChat verbindet Discord-Server miteinander, damit sich Menschen aus verschiedenen Servern unterhalten können.

    **Hubs** sind gemeinsame Kanäle, in denen viele Server schreiben. Der Chat wird nie still.

    **Anrufe** verbinden dich privat mit einer anderen Person – so lange ihr beide möchtet.
  examples: |-
    > **/call**: sprich sofort mit jemand Neuem
    > **/hub directory**: tritt einem Hub bei und chatte mit vielen Servern

  closingText: Gemacht vom InterChat-Team.
  buttons:
    shardInfo: Shard-Info

botLanding:
  title: 'Dein Server, verbunden. :globe_icon: Los geht''s serverübergreifend!'
  description: |
    Hi, ich bin InterChat. Ich verbinde diesen Server mit Gesprächen auf ganz Discord.

    ## 📞 1:1-Anrufe und Gruppenanrufe
    Starte einen Anruf und verbinde dich in Sekunden mit einem anderen Server. Gruppenanrufe bringen mehrere Server in dasselbe Gespräch.

    Nutze `/call`, `/skip` und `/hangup`. Jeder Anruf kann dich in der `/leaderboard` nach oben bringen. 😎
  hubs: |
    ## :house_icon: Hubs
    Hubs sind dauerhafte, **serverübergreifende** Communities. Verbinde mehrere Server mit einem gemeinsamen Raum, der auch zwischen den Gesprächen offen bleibt.

    - :pin: **Erstellen:** `/hub create` – lege deinen eigenen Hub an
    - :compass: **Entdecken:** `/hub browse` – finde öffentliche Hubs
    - :link_icon: **Verbinden:** `/hub connect` – tritt einem bestehenden Hub bei
    - ⚙️ **Verwalten:** `/hub manage` – öffne deine Hub-Einstellungen
    > Mit `/help` siehst du alle Befehle.

  closing: |
    **Bereit, einen anderen Server kennenzulernen? Starte einen Anruf, entdecke einen Hub oder erstelle unten deinen eigenen.**

    -# Mit :heart: gemacht von Sidequest Labs

