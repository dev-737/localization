rules:
  title: InterChat-Regeln
  body: Diese Regeln gelten überall, wo du InterChat nutzt, in Hubs wie in Anrufen.
  tabs:
    short: Die Regeln
    full: Vollständige Richtlinien
    moderation: Moderation
  short: |-
    > **1.** Behandle Menschen mit Respekt. Wenn jemand Stopp sagt, hör auf.
    > **2.** Greife niemanden für das an, was er ist. Keine Beleidigungen.
    > **3.** Keine Drohungen, und teile keine privaten Informationen.
    > **4.** Keine sexuellen Inhalte. Niemals mit Minderjährigen.
    > **5.** Kein Spam, und ruiniere nicht das Gespräch.
    > **6.** Umgehe keine Sperren und sende keine falschen Meldungen.
    > **7.** Auch Namen müssen diese Regeln einhalten.
  rules:
    title: Die Regeln
    commonSense: |
      ## Nutze deinen gesunden Menschenverstand
      Diese Regeln können nicht jede mögliche Situation abdecken.

      Wenn offensichtlich etwas getan wird, um eine andere Person zu verletzen, zu bedrohen, zu belästigen, zu sexualisieren oder ernsthaft zu stören, geh nicht davon aus, dass es erlaubt ist, nur weil du den genauen Wortlaut in diesen Regeln nicht findest.
    body: |
      ### 1. Behandle Menschen mit Respekt
      **Flachsen ist erlaubt. Belästigung nicht.**
      - Scherze und Frotzeleien sind in Ordnung, aber mach daraus keine wiederholten Beleidigungen, keine Belästigung und keine absichtlichen Versuche, jemanden zu verärgern.
      - Wenn dich jemand bittet aufzuhören, **hör auf**.
      - Provoziere, verspotte oder attackiere niemanden wiederholt, vor allem nicht, nachdem er dich gebeten hat aufzuhören.
      ### 2. Greife niemanden für das an, was er ist
      **Intoleranz ist nicht erlaubt.**
      - Greife niemanden an, beleidige oder erniedrige niemanden wegen Hautfarbe, ethnischer Herkunft, Nationalität, Religion, Geschlecht, Sexualität, Behinderung oder ähnlicher Merkmale.
      - Beleidigungen sind nicht erlaubt, auch wenn du behauptest, sie nutzen zu dürfen, weil sie auf dich zutreffen.
      ### 3. Sorge für die Sicherheit anderer
      **Keine Drohungen oder gefährliches Verhalten.**
      - Droh nicht damit, jemanden zu verletzen, zu töten oder sexuell zu missbrauchen.
      - Ermutige niemanden, sich selbst zu verletzen.
      - Ermutige niemanden zu Doxing, Swatting, Angriffen oder anderer Schädigung einer Person und hilf auch nicht dabei.

      **Teile keine privaten Informationen.**
      - Poste oder drohe nicht damit zu posten: Adresse, Telefonnummer, echter Name, Standort, IP-Adresse oder andere private Informationen einer Person.
      ### 4. Halte sexuelle Inhalte angemessen
      **Sexualisiere keine Minderjährigen.**
      - Sexuelle Witze, Geschichten, Kommentare oder Gespräche mit Minderjährigen sind nicht erlaubt.
      - Grooming, der Versuch, sexuelle Inhalte von einer minderjährigen Person zu erhalten, oder anderes sexuelles Verhalten gegenüber Minderjährigen wird besonders ernst genommen.

      **Halte explizite sexuelle Inhalte aus InterChat heraus.**
      - Kein Sexting, kein sexuelles Rollenspiel, keine eindeutigen sexuellen Nachrichten oder ähnliche Inhalte.
      - Flirten ist in Ordnung, wenn es erwünscht ist. Wenn jemand kein Interesse hat, **hör auf**.
      ### 5. Ruiniere nicht das Gespräch
      **Kein Spam und keine absichtlichen Störungen.**
      - Überflute keine Chats, sende keine riesigen Textwände, spamme keine Nachrichten oder Emojis und mach ein Gespräch nicht absichtlich unbrauchbar.
      ### 6. Behindere nicht die Moderation
      **Umgehe die Moderation nicht.**
      - Nutze kein anderes Konto und keine andere Methode, um eine aktive Sperre oder Einschränkung zu umgehen.

      **Missbrauche das Meldesystem nicht.**
      - Meldungen sollten ehrlich und in gutem Glauben erfolgen.
      - Sende keine falschen Meldungen, um jemanden bestrafen zu lassen.
      ### 7. Halte deine Identität angemessen
      **Auch Namen müssen die Regeln einhalten.**
      - Nutzernamen, Spitznamen, Servernamen und andere über InterChat angezeigte Namen müssen diese Regeln einhalten.

  enforcement: |
    ## So funktioniert Moderation
    Moderatoren schauen sich an, **was passiert ist, wie schwer es war, ob es Absicht war, gegen wen es sich richtete, ob die Person auf Aufforderung aufgehört hat und die jüngste Vorgeschichte.**
    ### Die Strafleiter ist:
    ```Verwarnung → 6h → 24h → 7d → 14d → 30d → Permanent```
    *Strafen sind nicht immer linear und hängen oft von Schwere und Kontext des Verstoßes ab. Normale Verstöße, die älter als 90 Tage sind, sollten in der Regel automatisch verfallen und eine Strafe nicht erhöhen.*

