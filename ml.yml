  voteReminders:
    title: "മുൻഗണനകൾ: വോട്ട് ഓർമ്മപ്പെടുത്തലുകൾ"
    description: വോട്ട് ഓർമ്മപ്പെടുത്തലുകൾ ഓണോ ഓഫോ ആക്കുക. വോട്ട് ചെയ്യുന്നത് നിങ്ങളുടെ പങ്കാളി സ്കിപ്പ് ചെയ്യുകയോ ഹാങ് അപ്പ് ചെയ്യുകയോ ചെയ്ത ശേഷം 12 മണിക്കൂർ നേരത്തേക്ക് വ്യക്തിഗത ഓട്ടോ-മാച്ചും അൺലോക്ക് ചെയ്യും.
    enabled: പ്രവർത്തനക്ഷമം
    disabled: പ്രവർത്തനരഹിതം
    dm:
      title: InterChat-നായി വോട്ട് ചെയ്യാനുള്ള സമയം!
      description: നിങ്ങളുടെ പിന്തുണ InterChat-നെ വളരാൻ സഹായിക്കുന്നു! ഞങ്ങളെ സഹായിക്കാൻ top.gg-ൽ വോട്ട് ചെയ്യൂ. പങ്കാളി സ്കിപ്പ് ചെയ്യുകയോ ഹാങ് അപ്പ് ചെയ്യുകയോ ചെയ്ത ശേഷം വീണ്ടും മാച്ച് ചെയ്യണോ എന്നും നിങ്ങൾക്ക് തിരഞ്ഞെടുക്കാം.
      reminderInfo: വോട്ടിന് ശേഷം നിങ്ങളുടെ ഓട്ടോ-മാച്ച് തിരഞ്ഞെടുപ്പുകൾ 12 മണിക്കൂർ സജീവമായിരിക്കും. `/my settings`-ൽ അവ മാനേജ് ചെയ്യാം.
      disableConfirm:
        title: വോട്ട് ഓർമ്മപ്പെടുത്തലുകൾ പ്രവർത്തനരഹിതമാക്കി
        description: ഇനി നിങ്ങൾക്ക് വോട്ട് ഓർമ്മപ്പെടുത്തൽ DM-കൾ ലഭിക്കില്ല. പങ്കാളി സ്കിപ്പ് ചെയ്യുകയോ ഹാങ് അപ്പ് ചെയ്യുകയോ ചെയ്ത ശേഷം വോട്ട് ചെയ്യുന്നത് 12 മണിക്കൂർ നേരത്തേക്ക് വ്യക്തിഗത ഓട്ടോ-മാച്ച് അൺലോക്ക് ചെയ്യും.
  errors:
    noPreferences: നിങ്ങൾ ഇതുവരെ ഒരു മുൻഗണനയും സജ്ജീകരിച്ചിട്ടില്ല.

