  startChatting: "ഹായ് പറയൂ, നിങ്ങൾക്ക് ഇഷ്ടമുള്ളത് പങ്കിടൂ, അല്ലെങ്കിൽ ഇതിനകം ചാറ്റ് ചെയ്യുന്ന ആർക്കെങ്കിലും മറുപടി നൽകൂ. തുടങ്ങാൻ ഒരു വഴി വേണോ? താഴെയുള്ള ഒരു സംഭാഷണ ആശയം പരീക്ഷിക്കൂ, അല്ലെങ്കിൽ എപ്പോൾ വേണമെങ്കിലും `/topic` ഉപയോഗിക്കൂ."
