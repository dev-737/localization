    buttonLabel: "അസഭ്യ പദ ഫിൽട്ടർ"
  userphone:
    title: Userphone ക്രമീകരണങ്ങൾ
    sectionDescription: കോളുകളിൽ നിങ്ങളുടെ സെർവർ എങ്ങനെ പെരുമാറണമെന്ന് ക്രമീകരിക്കുക.
    buttonLabel: Userphone ക്രമീകരണങ്ങൾ
    hideServerName:
      title: സെർവർ പേര് മറയ്ക്കുക
      description: '**ഗ്രൂപ്പ് കോളുകളിൽ** വെബ്ഹുക്ക് ഉപയോക്തൃനാമത്തിൽ നിന്ന് മറ്റ് സെർവറുകളുടെ പേരുകൾ മറയ്ക്കുന്നു. (1v1 കോളുകളിൽ എപ്പോഴും മറച്ചിരിക്കും).'
