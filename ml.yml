      missing: "**എനിക്ക് ഇതുവരെ {channel} ഉപയോഗിക്കാനാകില്ല.** മറ്റ് സെർവറുകളിൽ നിന്നുള്ള സന്ദേശങ്ങൾ അവരുടെ പേരുകളും അവതാറുകളും സഹിതം കാണിക്കാൻ മുകളിൽ അടയാളപ്പെടുത്തിയ അനുമതികൾ എനിക്ക് വേണം. ചാനൽ ക്രമീകരണങ്ങൾ തുറന്ന് **അനുമതികൾ** എന്നതിലേക്ക് പോകുക, InterChat റോളിന് കുറവുള്ളവ നൽകുക, തുടർന്ന് **വീണ്ടും പരിശോധിക്കുക** അമർത്തുക."
