conversationIdeas:
  title: സംഭാഷണ ആശയം
  description: ഒരു ഹബ്ബിനോ ടെക്സ്റ്റ് കോളിനോ ഒരു സ്വകാര്യ സംഭാഷണ ആശയം നേടുക
  another: മറ്റൊരു ആശയം
  hint: "ഇത് നിങ്ങൾക്ക് മാത്രമേ കാണാനാകൂ. ചാറ്റിൽ ചോദിക്കുക അല്ലെങ്കിൽ സ്വന്തം ഉത്തരം പങ്കിടുക. നിങ്ങൾക്ക് വേണ്ടി ഒന്നും അയയ്ക്കില്ല."
  callHint: "ഇതൊരു ടെക്സ്റ്റ് ചാറ്റാണ്. സ്വകാര്യ സംഭാഷണ ആശയത്തിന് `/topic`, മറ്റൊരു ചാറ്റ് കണ്ടെത്താൻ `/skip`, അല്ലെങ്കിൽ പുറത്തുപോകാൻ `/hangup` ഉപയോഗിക്കുക."
  prompts:
    games: "നിങ്ങൾക്ക് എപ്പോഴും വീണ്ടും കളിക്കാൻ തോന്നുന്ന ഗെയിം ഏതാണ്?"
    music: "ഈയിടെ നിങ്ങൾ വീണ്ടും വീണ്ടും കേൾക്കുന്ന പാട്ട് ഏതാണ്?"
    hobbies: "പരീക്ഷിക്കാൻ ആഗ്രഹിക്കുന്ന ഒരു ഹോബി ഏതാണ്?"
    skills: "ഒരു കഴിവ് തൽക്ഷണം പഠിക്കാൻ കഴിയുമെങ്കിൽ നിങ്ങൾ ഏത് തിരഞ്ഞെടുക്കും?"
    fiction: "ഏത് സാങ്കൽപ്പിക ലോകം സന്ദർശിക്കാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്നു, എന്തുകൊണ്ട്?"
    smallJoys: "ഈ ആഴ്ച നിങ്ങളെ ചിരിപ്പിച്ച ഒരു ചെറിയ കാര്യം എന്താണ്?"

