invite:
  title: നിങ്ങളുടെ സെർവറിലേക്ക് InterChat ചേർക്കുക
  description: സൗജന്യമാണ്, ഏകദേശം ഒരു മിനിറ്റ് എടുക്കും.
  steps: |-
    > **1.** താഴെയുള്ള **സെർവറിലേക്ക് ചേർക്കുക** അമർത്തുക
    > **2.** നിങ്ങളുടെ സെർവർ തിരഞ്ഞെടുക്കുക
    > **3.** ഉപയോഗിക്കാൻ ആഗ്രഹിക്കുന്ന ചാനലിൽ `/setup` പ്രവർത്തിപ്പിക്കുക
  footer: നിങ്ങൾ തിരഞ്ഞെടുക്കുന്ന സെർവറിൽ നിങ്ങൾക്ക് **സെർവർ മാനേജ് ചെയ്യുക** വേണം.

rules:
  title: InterChat നിയമങ്ങൾ
  body: ഈ നിയമങ്ങൾ നിങ്ങൾ InterChat ഉപയോഗിക്കുന്ന എല്ലായിടത്തും ബാധകമാണ്, ഹബ്ബുകളിലും കോളുകളിലും ഒരുപോലെ.
  tabs:
    short: നിയമങ്ങൾ
    full: പൂർണ്ണ മാർഗ്ഗനിർദ്ദേശങ്ങൾ
    moderation: മോഡറേഷൻ
  short: |-
    > **1.** ആളുകളോട് ബഹുമാനത്തോടെ പെരുമാറുക. ആരെങ്കിലും നിർത്തൂ എന്ന് പറഞ്ഞാൽ നിർത്തുക.
    > **2.** ആളുകളെ അവർ ആരാണ് എന്നതിന്റെ പേരിൽ ആക്രമിക്കരുത്. അധിക്ഷേപ വാക്കുകൾ പാടില്ല.
    > **3.** ഭീഷണികൾ പാടില്ല, സ്വകാര്യ വിവരങ്ങൾ പങ്കിടരുത്.
    > **4.** ലൈംഗിക ഉള്ളടക്കം പാടില്ല. പ്രായപൂർത്തിയാകാത്തവരെ ഉൾപ്പെടുത്തുന്നത് ഒരിക്കലും പാടില്ല.
    > **5.** സ്പാം പാടില്ല, സംഭാഷണം നശിപ്പിക്കരുത്.
    > **6.** വിലക്കുകൾ മറികടക്കരുത്, വ്യാജ റിപ്പോർട്ടുകൾ അയയ്ക്കരുത്.
    > **7.** പേരുകളും ഈ നിയമങ്ങൾ പാലിക്കണം.
  rules:
    title: നിയമങ്ങൾ
    commonSense: |
      ## സാമാന്യബുദ്ധി ഉപയോഗിക്കുക
      ഈ നിയമങ്ങൾക്ക് സാധ്യമായ എല്ലാ സാഹചര്യങ്ങളും ഉൾക്കൊള്ളാൻ കഴിയില്ല.

      മറ്റൊരാളെ വേദനിപ്പിക്കാനോ ഭീഷണിപ്പെടുത്താനോ ഉപദ്രവിക്കാനോ ലൈംഗികവൽക്കരിക്കാനോ ഗുരുതരമായി തടസ്സപ്പെടുത്താനോ വേണ്ടി എന്തെങ്കിലും ചെയ്യുന്നതായി വ്യക്തമാണെങ്കിൽ, ഈ നിയമങ്ങളിൽ കൃത്യമായ വാക്കുകൾ കണ്ടെത്താൻ കഴിയാത്തതുകൊണ്ട് മാത്രം അത് അനുവദനീയമാണെന്ന് കരുതരുത്.
    body: |
      ### 1. ആളുകളോട് ബഹുമാനത്തോടെ പെരുമാറുക
      **തമാശ അനുവദനീയമാണ്. ഉപദ്രവം അല്ല.**
      - തമാശയും കളിയാക്കലും കുഴപ്പമില്ല, പക്ഷേ അവയെ ആവർത്തിച്ചുള്ള അധിക്ഷേപങ്ങളോ ഉപദ്രവമോ ഒരാളെ മനഃപൂർവം വിഷമിപ്പിക്കാനുള്ള ശ്രമങ്ങളോ ആക്കി മാറ്റരുത്.
      - ആരെങ്കിലും നിർത്താൻ ആവശ്യപ്പെട്ടാൽ **നിർത്തുക**.
      - ഒരാളെ ആവർത്തിച്ച് പ്രകോപിപ്പിക്കുകയോ പരിഹസിക്കുകയോ ആക്രമിക്കുകയോ ചെയ്യരുത്, പ്രത്യേകിച്ച് നിർത്താൻ ആവശ്യപ്പെട്ടതിന് ശേഷം.
      ### 2. ആളുകളെ അവർ ആരാണ് എന്നതിന്റെ പേരിൽ ആക്രമിക്കരുത്
      **മതഭ്രാന്തും വിദ്വേഷവും അനുവദനീയമല്ല.**
      - വംശം, വർഗ്ഗം, ദേശീയത, മതം, ലിംഗം, ലൈംഗികത, വൈകല്യം അല്ലെങ്കിൽ സമാന സവിശേഷതകൾ എന്നിവയുടെ പേരിൽ ആരെയും ആക്രമിക്കുകയോ അപമാനിക്കുകയോ താഴ്ത്തിക്കെട്ടുകയോ ചെയ്യരുത്.
      - അധിക്ഷേപ വാക്കുകൾ അനുവദനീയമല്ല, അവ നിങ്ങൾക്ക് ബാധകമായതിനാൽ ഉപയോഗിക്കാമെന്ന് നിങ്ങൾ വാദിച്ചാലും.
      ### 3. ആളുകളെ സുരക്ഷിതരായി നിലനിർത്തുക
      **ഭീഷണികളോ അപകടകരമായ പെരുമാറ്റമോ പാടില്ല.**
      - ഒരാളെ വേദനിപ്പിക്കുമെന്നോ കൊല്ലുമെന്നോ ലൈംഗികമായി ആക്രമിക്കുമെന്നോ ഭീഷണിപ്പെടുത്തരുത്.
      - സ്വയം ഉപദ്രവിക്കാൻ ആരെയും പ്രോത്സാഹിപ്പിക്കരുത്.
      - ഡോക്സിംഗ്, സ്വാട്ടിംഗ്, ആക്രമണം അല്ലെങ്കിൽ മറ്റൊരാൾക്ക് ദോഷം വരുത്തുന്ന മറ്റ് പ്രവൃത്തികൾ ചെയ്യാൻ ആരെയും പ്രോത്സാഹിപ്പിക്കുകയോ സഹായിക്കുകയോ ചെയ്യരുത്.

      **സ്വകാര്യ വിവരങ്ങൾ പങ്കിടരുത്.**
      - ഒരാളുടെ വിലാസം, ഫോൺ നമ്പർ, യഥാർത്ഥ പേര്, ലൊക്കേഷൻ, IP വിലാസം അല്ലെങ്കിൽ മറ്റ് സ്വകാര്യ വിവരങ്ങൾ പോസ്റ്റ് ചെയ്യുകയോ പോസ്റ്റ് ചെയ്യുമെന്ന് ഭീഷണിപ്പെടുത്തുകയോ ചെയ്യരുത്.
      ### 4. ലൈംഗിക ഉള്ളടക്കം ഉചിതമായി നിലനിർത്തുക
      **പ്രായപൂർത്തിയാകാത്തവരെ ലൈംഗികവൽക്കരിക്കരുത്.**
      - പ്രായപൂർത്തിയാകാത്തവർ ഉൾപ്പെടുന്ന ലൈംഗിക തമാശകൾ, കഥകൾ, അഭിപ്രായങ്ങൾ, സംഭാഷണങ്ങൾ എന്നിവ അനുവദനീയമല്ല.
      - ഗ്രൂമിംഗ്, പ്രായപൂർത്തിയാകാത്ത ഒരാളിൽ നിന്ന് ലൈംഗിക ഉള്ളടക്കം നേടാനുള്ള ശ്രമം, അല്ലെങ്കിൽ പ്രായപൂർത്തിയാകാത്തവരോടുള്ള മറ്റ് ലൈംഗിക പെരുമാറ്റം എന്നിവ പ്രത്യേക ഗൗരവത്തോടെ കൈകാര്യം ചെയ്യും.

      **വ്യക്തമായ ലൈംഗിക ഉള്ളടക്കം InterChat-ൽ നിന്ന് ഒഴിവാക്കുക.**
      - സെക്സ്റ്റിംഗ്, ലൈംഗിക റോൾപ്ലേ, ഗ്രാഫിക് ലൈംഗിക സന്ദേശങ്ങൾ, സമാന ഉള്ളടക്കം എന്നിവ പാടില്ല.
      - സ്വാഗതം ചെയ്യപ്പെടുമ്പോൾ ഫ്ലർട്ട് ചെയ്യുന്നത് കുഴപ്പമില്ല. ആർക്കെങ്കിലും താൽപ്പര്യമില്ലെങ്കിൽ **നിർത്തുക**.
      ### 5. സംഭാഷണം നശിപ്പിക്കരുത്
      **സ്പാമോ മനഃപൂർവമായ തടസ്സപ്പെടുത്തലോ പാടില്ല.**
      - ചാറ്റുകൾ നിറയ്ക്കുകയോ വലിയ ടെക്സ്റ്റ് മതിലുകൾ അയയ്ക്കുകയോ സന്ദേശങ്ങളോ ഇമോജികളോ സ്പാം ചെയ്യുകയോ ഒരു സംഭാഷണം മനഃപൂർവം ഉപയോഗശൂന്യമാക്കുകയോ ചെയ്യരുത്.
      ### 6. മോഡറേഷനിൽ ഇടപെടരുത്
      **മോഡറേഷൻ മറികടക്കരുത്.**
      - നിലവിലുള്ള വിലക്കോ നിയന്ത്രണമോ മറികടക്കാൻ മറ്റൊരു അക്കൗണ്ടോ മറ്റൊരു രീതിയോ ഉപയോഗിക്കരുത്.

      **റിപ്പോർട്ട് സംവിധാനം ദുരുപയോഗം ചെയ്യരുത്.**
      - റിപ്പോർട്ടുകൾ സത്യസന്ധവും നല്ല വിശ്വാസത്തോടെയുള്ളതും ആയിരിക്കണം.
      - ആരെയെങ്കിലും ശിക്ഷിപ്പിക്കാൻ വ്യാജ റിപ്പോർട്ടുകൾ ഉണ്ടാക്കരുത്.
      ### 7. നിങ്ങളുടെ വ്യക്തിത്വം ഉചിതമായി നിലനിർത്തുക
      **പേരുകളും നിയമങ്ങൾ പാലിക്കണം.**
      - InterChat വഴി കാണിക്കുന്ന ഉപയോക്തൃനാമങ്ങൾ, വിളിപ്പേരുകൾ, സെർവർ പേരുകൾ, മറ്റ് പേരുകൾ എന്നിവ ഈ നിയമങ്ങൾ പാലിക്കണം.

  enforcement: |
    ## മോഡറേഷൻ എങ്ങനെ പ്രവർത്തിക്കുന്നു
    മോഡറേറ്റർമാർ **എന്താണ് സംഭവിച്ചത്, എത്ര ഗുരുതരമായിരുന്നു, മനഃപൂർവമായിരുന്നോ, ആരെ ലക്ഷ്യമിട്ടായിരുന്നു, ആവശ്യപ്പെട്ടപ്പോൾ ആ വ്യക്തി നിർത്തിയോ, അവരുടെ സമീപകാല ചരിത്രം** എന്നിവ പരിശോധിക്കുന്നു.
    ### ശിക്ഷയുടെ ഗോവണി ഇതാണ്:
    ```മുന്നറിയിപ്പ് → 6h → 24h → 7d → 14d → 30d → സ്ഥിരം```
    *ശിക്ഷകൾ എല്ലായ്പ്പോഴും ക്രമമായിരിക്കണമെന്നില്ല, പലപ്പോഴും ലംഘനത്തിന്റെ ഗൗരവത്തെയും സാഹചര്യത്തെയും ആശ്രയിച്ചിരിക്കും. 90 ദിവസത്തിലധികം പഴക്കമുള്ള സാധാരണ ലംഘനങ്ങൾ പൊതുവെ സ്വയമേവ കാലഹരണപ്പെടുകയും ശിക്ഷ വർദ്ധിപ്പിക്കാതിരിക്കുകയും വേണം.*

