broadcast:
  spam:
    mutedMessage: സ്പാം കാരണം നിങ്ങളെ {minutes} മിനിറ്റ് താൽക്കാലികമായി മ്യൂട്ട് ചെയ്തിരിക്കുന്നു.
    warningMessage: ':alert_icon: നിങ്ങൾ വളരെ വേഗത്തിൽ സന്ദേശങ്ങൾ അയയ്ക്കുന്നു!'
    autoMuteReason: "ഓട്ടോ-മ്യൂട്ട്: സ്പാം കണ്ടെത്തി"
    autoWarnReason: "ഓട്ടോ-മുന്നറിയിപ്പ്: സ്പാം കണ്ടെത്തി"
  validation:
    accountAge:
      message: InterChat വഴി സന്ദേശങ്ങൾ അയയ്ക്കാൻ നിങ്ങളുടെ അക്കൗണ്ട് വളരെ പുതിയതാണ്.
      reason: അക്കൗണ്ട് വളരെ പുതിയത്
    hubLock:
      message: ഈ ഹബ് ഇപ്പോൾ ലോക്ക് ചെയ്തിരിക്കുന്നു.
      reason: ഹബ് ഇപ്പോൾ ലോക്ക് ചെയ്തിരിക്കുന്നു
    invites:
      message: ':ban: ഈ ഹബ്ബിൽ Discord ഇൻവൈറ്റ് ലിങ്കുകൾ അനുവദനീയമല്ല.'
    nsfw:
      message: ':ban: നിങ്ങളുടെ സന്ദേശം InterChat ഫിൽട്ടറുകൾ തടഞ്ഞു (കാരണം: NSFW കണ്ടെത്തൽ)'
    profanity:
      message: ':ban: നിങ്ങളുടെ സന്ദേശം ഹബ്ബിന്റെ അസഭ്യ പദ ഫിൽട്ടർ തടഞ്ഞു.'
      reason: അസഭ്യ പദ ഫിൽട്ടർ സന്ദേശം തടഞ്ഞു
    videos:
      message: ':ban: ഈ ഹബ്ബിൽ വീഡിയോ അറ്റാച്ച്മെന്റുകൾ അനുവദനീയമല്ല.'
    messageLength:
      reason: സന്ദേശ ദൈർഘ്യം
      message: നിങ്ങളുടെ സന്ദേശം വളരെ നീണ്ടതാണ്. ദയവായി ചുരുക്കുക.
    spam:
      reason: സ്പാം കണ്ടെത്തി
    accessRestriction:
      prefix: "ആക്സസ് നിയന്ത്രിച്ചിരിക്കുന്നു:"
      reason: സജീവ നിയന്ത്രണം

blacklist:
  add:
    title: ബ്ലോക്ക്‌ലിസ്റ്റിലേക്ക് ചേർക്കുക
    type:
      label: തരം
      description: നിങ്ങൾ ഒരു ഉപയോക്താവിനെയാണോ സെർവറിനെയാണോ ബ്ലോക്ക് ചെയ്യുന്നതെന്ന് വ്യക്തമാക്കുക.
      options:
        userDesc: ഒരു പ്രത്യേക ഉപയോക്താവിനെ ബ്ലോക്ക് ചെയ്യുക.
        serverDesc: ഒരു മുഴുവൻ സെർവറിനെ ബ്ലോക്ക് ചെയ്യുക.
    id:
      label: ബ്ലോക്ക് ചെയ്യേണ്ട ഉപയോക്താവിന്റെയോ സെർവറിന്റെയോ ID
      placeholder: ഉപയോക്താവിന്റെ ID അല്ലെങ്കിൽ സെർവർ ID നൽകുക
    reason:
      label: കുറിപ്പ് (ഓപ്ഷണൽ)
      description: ഒരു ചെറിയ കുറിപ്പ് നിങ്ങൾ എന്തിനാണ് ബ്ലോക്ക് ചെയ്തതെന്ന് ഓർമ്മിക്കാൻ സഹായിക്കുന്നു.
      placeholder: ഉദാ., സ്പാമർ, ശല്യം, ടോക്സിക് തുടങ്ങിയവ.
    messages:
      success: "{id} ബ്ലോക്ക് ചെയ്തു, കാരണം: {reason}"
    errors:
      selfBlock: "{cross} ഈ സെർവറിനെ തന്നെ ബ്ലോക്ക് ചെയ്യാൻ കഴിയില്ല."
      selfUserBlock: "{cross} നിങ്ങളെത്തന്നെ ബ്ലോക്ക് ചെയ്യാൻ കഴിയില്ല."
      failed: "{id} ബ്ലോക്ക് ചെയ്യാനായില്ല."
  list:
    filters:
      all: "എല്ലാം ({count})"
      users: ഉപയോക്താക്കൾ
      servers: സെർവറുകൾ
    empty:
      all: "നിങ്ങൾ വളരെ നല്ലവരാണ്! ഇവിടെ കാണാൻ കുറച്ച് സെർവറുകളെ/ഉപയോക്താക്കളെ ബ്ലോക്ക് ചെയ്യുക."
      users: "ബ്ലോക്ക് ചെയ്ത ഉപയോക്താക്കളെ കണ്ടെത്തിയില്ല."
      servers: "ബ്ലോക്ക് ചെയ്ത സെർവറുകളെ കണ്ടെത്തിയില്ല."
    instructions: '"ബ്ലോക്ക്‌ലിസ്റ്റിലേക്ക് ചേർക്കുക" ബട്ടൺ ഉപയോഗിച്ച് നിങ്ങൾക്ക് സെർവറുകളെയോ ഉപയോക്താക്കളെയോ ബ്ലോക്ക്‌ലിസ്റ്റിലേക്ക് ചേർക്കാം.'
    errors:
      notFound: "{cross} ഇനം കണ്ടെത്തിയില്ല അല്ലെങ്കിൽ ഇതിനകം നീക്കം ചെയ്തു."
      removeFailed: "{cross} ഇനം നീക്കം ചെയ്യുന്നതിൽ പിശക്: {error}"

commands:
  suggestion:
    title: ഫീഡ്ബാക്ക് അയയ്ക്കുക
    overview:
      label: സംഗ്രഹം
      placeholder: "ഒരു വരിയിൽ: എന്താണ് തെറ്റിയത്, അല്ലെങ്കിൽ നിങ്ങൾ എന്താണ് ആഗ്രഹിക്കുന്നത്"
    description:
      label: *label_description
      placeholder: "എന്താണ് സംഭവിച്ചതെന്ന് ഘട്ടം ഘട്ടമായി ഞങ്ങളോട് പറയുക"
    category:
      label: "ഇത് എന്തിനെക്കുറിച്ചാണ്?"
      options:
        bug: എന്തോ തകരാറിലാണ്
        bugDesc: നിങ്ങൾ നേരിട്ട ഒരു പ്രശ്നം റിപ്പോർട്ട് ചെയ്യുക
        suggestion: എനിക്കൊരു ആശയമുണ്ട്
        suggestionDesc: ഒരു ഫീച്ചറോ മെച്ചപ്പെടുത്തലോ നിർദ്ദേശിക്കുക
    errorId:
      label: എറർ ID (ഓപ്ഷണൽ)
      placeholder: എറർ സന്ദേശത്തിലെ എറർ ID പേസ്റ്റ് ചെയ്യുക
    messages:
      success: "{tick} നന്ദി! നിങ്ങളുടെ ഫീഡ്ബാക്ക് InterChat ടീമിന് അയച്ചു."
  report:
    title: ഒരു സന്ദേശം എങ്ങനെ റിപ്പോർട്ട് ചെയ്യാം
    description: |-
      > **1.** സന്ദേശത്തിൽ റൈറ്റ്-ക്ലിക്ക് ചെയ്യുക
      > **2.** **ആപ്പുകൾ → റിപ്പോർട്ട്** എന്നതിലേക്ക് പോകുക
      > **3.** ഒരു കാരണം തിരഞ്ഞെടുക്കുക. ഞങ്ങൾ അത് ശരിയായ ടീമിന് അയയ്ക്കും
    footer: റിപ്പോർട്ടുകൾ ഹബ്ബിന്റെ മോഡറേറ്റർമാർക്കോ InterChat സ്റ്റാഫിനോ പോകുന്നു.
    loadingGif: മുകളിലെ GIF ലോഡ് ആകാൻ അൽപ്പം സമയമെടുത്തേക്കാം.

userphone:
  commands:
    start:
      description: ഒരു Userphone കോൾ തുടങ്ങി മറ്റൊരു സെർവറുമായി ബന്ധപ്പെടുക
    end:
      description: നിലവിലെ Userphone കോൾ അവസാനിപ്പിക്കുക
    skip:
      description: നിലവിലെ കോൾ സ്കിപ്പ് ചെയ്ത് പുതിയ പങ്കാളിയെ തിരയുക
    block:
      description: Userphone വഴി നിങ്ങളുമായി ബന്ധപ്പെടുന്നതിൽ നിന്ന് ഒരു ഉപയോക്താവിനെ ബ്ലോക്ക് ചെയ്യുക
    unblock:
      description: Userphone-ൽ ഒരു ഉപയോക്താവിനെ അൺബ്ലോക്ക് ചെയ്യുക
    report:
      description: നിങ്ങൾ ബന്ധപ്പെട്ടിരിക്കുന്ന ഉപയോക്താവിനെ റിപ്പോർട്ട് ചെയ്യുക
    stats:
      description: നിങ്ങളുടെ Userphone സ്ഥിതിവിവരക്കണക്കുകൾ കാണുക
  status:
    alreadyInCall: "{cross} ഈ ചാനൽ ഇതിനകം ഒരു Userphone കോളിലാണ്. ആദ്യം വിച്ഛേദിക്കാൻ `/userphone end` ഉപയോഗിക്കുക."
    alreadyInCallDuration: "{cross} ഈ ചാനൽ ഇതിനകം ഒരു Userphone കോളിലാണ്. നിലവിലെ ദൈർഘ്യം: **{duration}**."
    connected: "{tick} **ബന്ധപ്പെട്ടു!** നിങ്ങൾ ഇപ്പോൾ മറ്റൊരു സെർവറുമായി ചാറ്റ് ചെയ്യുന്നു. ഹായ് പറയൂ! 👋"
