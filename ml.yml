about:
  title: InterChat-നെക്കുറിച്ച്
  tagline: സെർവറുകൾ, ബന്ധിപ്പിച്ചത്.
  description: |-
    വ്യത്യസ്ത സെർവറുകളിലെ ആളുകൾക്ക് പരസ്പരം സംസാരിക്കാൻ കഴിയുംവിധം InterChat Discord സെർവറുകളെ ബന്ധിപ്പിക്കുന്നു.

    **ഹബ്ബുകൾ** പല സെർവറുകളും സന്ദേശമയയ്ക്കുന്ന പങ്കിട്ട ചാനലുകളാണ്. ചാറ്റ് ഒരിക്കലും നിശ്ശബ്ദമാകില്ല.

    **കോളുകൾ** നിങ്ങൾ രണ്ടുപേരും ആഗ്രഹിക്കുന്നത്രയും സമയം മറ്റൊരാളുമായി സ്വകാര്യമായി ബന്ധിപ്പിക്കുന്നു.
  examples: |-
    > **/call**: ഇപ്പോൾത്തന്നെ പുതിയൊരാളോട് സംസാരിക്കൂ
    > **/hub directory**: ഒരു ഹബ്ബിൽ ചേർന്ന് പല സെർവറുകളുമായി ചാറ്റ് ചെയ്യൂ

  closingText: InterChat ടീം നിർമ്മിച്ചത്.
  buttons:
    shardInfo: ഷാർഡ് വിവരങ്ങൾ

botLanding:
  title: 'നിങ്ങളുടെ സെർവർ, ബന്ധിപ്പിച്ചത്. :globe_icon: ക്രോസ്-സെർവർ ആയി മുന്നേറാം!'
  description: |
    ഹായ്, ഞാൻ InterChat ആണ്. ഞാൻ ഈ സെർവറിനെ Discord-ലെ ഉടനീളമുള്ള സംഭാഷണങ്ങളുമായി ബന്ധിപ്പിക്കുന്നു.

    ## 📞 1:1 കോളുകളും ഗ്രൂപ്പ് കോളുകളും
    ഒരു കോൾ തുടങ്ങി നിമിഷങ്ങൾക്കുള്ളിൽ മറ്റൊരു സെർവറുമായി ബന്ധപ്പെടൂ. ഗ്രൂപ്പ് കോളുകൾ ഒന്നിലധികം സെർവറുകളെ ഒരേ സംഭാഷണത്തിലേക്ക് കൊണ്ടുവരുന്നു.

    `/call`, `/skip`, `/hangup` എന്നിവ ഉപയോഗിക്കൂ. ഓരോ കോളും നിങ്ങളെ `/leaderboard`-ൽ മുകളിലേക്ക് എത്തിക്കും. 😎
  hubs: |
    ## :house_icon: ഹബ്ബുകൾ
    ഹബ്ബുകൾ സ്ഥിരമായ, **ക്രോസ്-സെർവർ** കമ്മ്യൂണിറ്റികളാണ്. പല സെർവറുകളെ സംഭാഷണങ്ങൾക്കിടയിലും തുറന്നിരിക്കുന്ന ഒരു പങ്കിട്ട ഇടത്തേക്ക് ബന്ധിപ്പിക്കൂ.

    - :pin: **സൃഷ്ടിക്കുക:** `/hub create` - സ്വന്തമായി ഒരു ഹബ് ഉണ്ടാക്കൂ
    - :compass: **പര്യവേക്ഷണം ചെയ്യുക:** `/hub browse` - പബ്ലിക് ഹബ്ബുകൾ കണ്ടെത്തൂ
    - :link_icon: **ബന്ധിപ്പിക്കുക:** `/hub connect` - നിലവിലുള്ള ഒരു ഹബ്ബിൽ ചേരൂ
    - ⚙️ **മാനേജ് ചെയ്യുക:** `/hub manage` - നിങ്ങളുടെ ഹബ് ക്രമീകരണങ്ങൾ തുറക്കൂ
    > എല്ലാ കമാൻഡുകളും കാണാൻ `/help` ഉപയോഗിക്കൂ.

  closing: |
    **മറ്റൊരു സെർവറിനെ പരിചയപ്പെടാൻ തയ്യാറാണോ? ഒരു കോൾ പരീക്ഷിക്കൂ, ഒരു ഹബ് കണ്ടെത്തൂ, അല്ലെങ്കിൽ താഴെ സ്വന്തമായി ഒന്ന് സൃഷ്ടിക്കൂ.**

    -# Sidequest Labs :heart: കൊണ്ട് നിർമ്മിച്ചത്

