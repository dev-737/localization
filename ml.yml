      title: മാച്ചിൽ പിംഗ്
      description: 1v1 കോൾ മാച്ച് കണ്ടെത്തുമ്പോൾ നിങ്ങളുടെ ചാനലിൽ ഒരു പിംഗ് അയയ്ക്കുക.
    autoRequeueOnSkip:
      title: സ്കിപ്പിൽ ഓട്ടോ റീക്യൂ
      description: മറുഭാഗം സ്കിപ്പ് ചെയ്യുമ്പോൾ സ്വയമേവ പുതിയ കോൾ തുടങ്ങുന്നു. നിങ്ങൾ അടുത്തിടെ കോളിൽ സജീവമായിരുന്നെങ്കിൽ മാത്രമേ പ്രവർത്തിക്കൂ.
    autoRequeueOnHangup:
      title: ഹാങ്ങപ്പിൽ ഓട്ടോ റീക്യൂ
      description: മറുഭാഗം ഹാങ്ങപ്പ് ചെയ്യുമ്പോൾ സ്വയമേവ പുതിയ കോൾ തുടങ്ങുന്നു. നിങ്ങൾ അടുത്തിടെ കോളിൽ സജീവമായിരുന്നെങ്കിൽ മാത്രമേ പ്രവർത്തിക്കൂ.
      ignoreSuccess: "{tick} റിപ്പോർട്ട് `{id}` അവഗണിച്ചതായി അടയാളപ്പെടുത്തി."
    lobbyChannels:
      title: അനുവദിച്ച ലോബി ചാനലുകൾ
      description: കോൾ, സ്കിപ്പ്, ഹാങ്ങപ്പ് എന്നിവ തിരഞ്ഞെടുത്ത ടെക്സ്റ്റ് ചാനലുകളിലേക്ക് പരിമിതപ്പെടുത്തുക. ചാനലുകളൊന്നും തിരഞ്ഞെടുക്കാത്തപ്പോൾ ഈ കമാൻഡുകൾ എല്ലായിടത്തും പ്രവർത്തിക്കും.
      selectPlaceholder: ടെക്സ്റ്റ് ചാനലുകൾ തിരഞ്ഞെടുക്കുക
      currentlyAllowed: കമാൻഡുകൾ നിലവിൽ അനുവദനീയമായത്
      everywhere: ചാനലുകളൊന്നും തിരഞ്ഞെടുക്കാത്തപ്പോൾ ലോബി കമാൻഡുകൾ എല്ലാ ടെക്സ്റ്റ് ചാനലിലും പ്രവർത്തിക്കും.
      unsaved: സേവ് ചെയ്യാത്ത മാറ്റങ്ങൾ - പ്രയോഗിക്കാൻ മാറ്റങ്ങൾ സേവ് ചെയ്യുക അമർത്തുക.
      saved: ലോബി ചാനൽ നിയന്ത്രണങ്ങൾ സേവ് ചെയ്തു.
      manageChannelsRequired: ലോബി ചാനലുകൾ എഡിറ്റ് ചെയ്യാൻ നിങ്ങൾക്ക് ചാനലുകൾ മാനേജ് ചെയ്യുക അനുമതി വേണം.

