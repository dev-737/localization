    cancelled:
      nothingChanged: "**സജ്ജീകരണം റദ്ദാക്കി.** ഒന്നും മാറ്റിയിട്ടില്ല. തയ്യാറാകുമ്പോൾ `/setup` പ്രവർത്തിപ്പിക്കുക."
      keptChannel: "**സജ്ജീകരണം റദ്ദാക്കി.** {channel} നിലനിർത്തിയിട്ടുണ്ട്, അടുത്ത തവണ ഉപയോഗിക്കാം, അല്ലെങ്കിൽ ഇല്ലാതാക്കാം. തയ്യാറാകുമ്പോൾ `/setup` പ്രവർത്തിപ്പിക്കുക."
    welcome:
      title: InterChat ചേർത്തതിന് നന്ദി
      description: ഒരു ചാനലിനെ ഹബ്ബുമായി ബന്ധിപ്പിച്ചാൽ നിങ്ങളുടെ അംഗങ്ങൾക്ക് മറ്റ് കമ്മ്യൂണിറ്റികളുമായി സംസാരിക്കാം. സജ്ജീകരണത്തിന് ഏകദേശം ഒരു മിനിറ്റ് എടുക്കും.
      start: സജ്ജീകരണം ആരംഭിക്കുക
      whatIsHub: എന്താണ് ഹബ്?
      whoCanSetUp: സെർവർ മാനേജ് ചെയ്യുക, ചാനലുകൾ മാനേജ് ചെയ്യുക എന്നിവയുള്ള അംഗങ്ങൾക്കുള്ളതാണ് സജ്ജീകരണം.
      hubExplainer: "**ഹബ് എന്നത് പല സെർവറുകളിലായി പങ്കിടുന്ന ഒരു ചാനലാണ്.** നിങ്ങളുടെ ഒരു ചാനൽ ബന്ധിപ്പിച്ചാൽ അതിലെ സന്ദേശങ്ങൾ ഹബ്ബിലെ മറ്റെല്ലാ സെർവറുകളിലേക്കും പോകും, അവരുടെ മറുപടികൾ നിങ്ങൾക്കും ലഭിക്കും. `/hub leave` ഉപയോഗിച്ച് എപ്പോൾ വേണമെങ്കിലും ഹബ് വിടാം."
      dmFallback: "ഞാൻ **{server}**-ൽ ചേർന്നു, പക്ഷേ അതിലെ ഒരു ചാനലിലും എനിക്ക് പോസ്റ്റ് ചെയ്യാൻ കഴിയില്ല. എവിടെയെങ്കിലും InterChat-ന് **ചാനൽ കാണുക**, **സന്ദേശങ്ങൾ അയയ്ക്കുക**, **ഫയലുകൾ അറ്റാച്ച് ചെയ്യുക** എന്നിവ അനുവദിച്ച് അവിടെ `/setup` പ്രവർത്തിപ്പിക്കുക."

