vote:
  title: InterChat-ന് വോട്ട് ചെയ്യുക
  description: ഇതിന് 10 സെക്കൻഡ് മതി, കൂടുതൽ സെർവറുകൾക്ക് ഞങ്ങളെ കണ്ടെത്താൻ ഇത് സഹായിക്കുന്നു.
  rewards: |-
    ## 12 മണിക്കൂറിന് നിങ്ങൾക്ക് ലഭിക്കുന്നത്
    > **സെർവർ ഇമോജികൾ**: നിങ്ങളുടെ സന്ദേശങ്ങളിൽ ഏത് ഇമോജിയും ഉപയോഗിക്കുക
    > **വോട്ടർ ബാഡ്ജ്**: നിങ്ങളുടെ InterChat പ്രൊഫൈലിൽ കാണിക്കും
    > **വ്യക്തിഗത ഓട്ടോ-മാച്ച്**: പങ്കാളി സ്കിപ്പ് ചെയ്യുകയോ ഹാങ്ങപ്പ് ചെയ്യുകയോ ചെയ്താൽ വീണ്ടും മാച്ച് ചെയ്യണോ എന്ന് തിരഞ്ഞെടുക്കുക
  alreadyVoted: |-
    ## :party_popper: വോട്ട് ചെയ്തതിന് നന്ദി!
    നിങ്ങൾക്ക് **{next}** വീണ്ടും വോട്ട് ചെയ്യാം.
    പങ്കാളി സ്കിപ്പ് ചെയ്യുമ്പോഴോ ഹാങ്ങപ്പ് ചെയ്യുമ്പോഴോ വേണ്ട വ്യക്തിഗത ഓട്ടോ-മാച്ച് തിരഞ്ഞെടുപ്പുകൾ `/my settings`-ൽ സജ്ജമാക്കുക.
  thanks:
    title: വോട്ട് ചെയ്തതിന് നന്ദി!
    intro: നിങ്ങളുടെ വോട്ട് കൂടുതൽ സെർവറുകൾക്ക് InterChat കണ്ടെത്താൻ സഹായിക്കുന്നു. 10 സെക്കൻഡ് ചെലവഴിച്ചതിന് നന്ദി. പങ്കാളി സ്കിപ്പ് ചെയ്യുകയോ ഹാങ്ങപ്പ് ചെയ്യുകയോ ചെയ്താൽ 12 മണിക്കൂർ വീണ്ടും മാച്ച് ചെയ്യണോ എന്ന് തിരഞ്ഞെടുക്കാനും ഇത് അനുവദിക്കുന്നു; അത് `/my settings`-ൽ സജ്ജമാക്കുക.
    activeHeading: അടുത്ത 12 മണിക്കൂർ സജീവം
    emojiTitle: സെർവർ ഇമോജികൾ
    emojiBody: നിങ്ങളുടെ സന്ദേശങ്ങളിൽ ഏത് സെർവറിലെയും ഇമോജി ഉപയോഗിക്കുക.
    roleTitle: വോട്ടർ റോൾ
    roleBody: സപ്പോർട്ട് സെർവറിൽ നൽകുകയും നിങ്ങളുടെ വോട്ട് കാലഹരണപ്പെടുമ്പോൾ നീക്കം ചെയ്യുകയും ചെയ്യും, അതിനാൽ നിലനിർത്താൻ വീണ്ടും വോട്ട് ചെയ്യുക.
    keepHeading: എന്നും നിങ്ങളുടേത്
    badgeTitle: വോട്ടർ ബാഡ്ജ്
    badgeBody: ഇപ്പോൾ നിങ്ങളുടെ InterChat പ്രൊഫൈലിൽ.
    freezeTitle: ഒരു സ്ട്രീക്ക് ഫ്രീസ്
    freezeBody: നഷ്ടപ്പെട്ട ദിവസത്തിനായി സൂക്ഷിക്കുന്നു, പരമാവധി 2 വരെ.
    supportButton: സപ്പോർട്ട് സെർവർ
    footer: "വോട്ട് #{count} · അടുത്ത വോട്ട് {next} ലഭ്യം"

services:
  hub:
    validation:
      invalidName: നൽകിയ ഹബ് പേര് അസാധുവാണ്.
      nameTaken: ആ ഹബ് പേര് ഇതിനകം എടുത്തിട്ടുണ്ട്.
    defaults:
      noDescription: വിവരണം നൽകിയിട്ടില്ല.
  moderation:
    defaults:
      noReason: *no_reason

support:
