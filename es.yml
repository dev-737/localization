about:
  title: Acerca de InterChat
  tagline: Servidores, conectados.
  description: |-
    InterChat une servidores de Discord para que personas de distintos servidores puedan hablar entre sí.

    Los **hubs** son canales compartidos en los que escriben muchos servidores. El chat nunca se queda en silencio.

    Las **llamadas** te conectan en privado con otra persona, el tiempo que ambos quieran.
  examples: |-
    > **/call**: habla con alguien nuevo ahora mismo
    > **/hub directory**: únete a un hub y chatea con muchos servidores

  closingText: Hecho por el equipo de InterChat.
  buttons:
    shardInfo: Información de shards

botLanding:
  title: 'Tu servidor, conectado. :globe_icon: ¡Vamos entre servidores!'
  description: |
    Hola, soy InterChat. Conecto este servidor con conversaciones de todo Discord.

    ## 📞 Llamadas 1:1 y grupales
    Inicia una llamada y conecta con otro servidor en segundos. Las llamadas grupales reúnen a varios servidores en la misma conversación.

    Usa `/call`, `/skip` y `/hangup`. Cada llamada puede subirte en `/leaderboard`. 😎
  hubs: |
    ## :house_icon: Hubs
    Los hubs son comunidades **entre servidores** y permanentes. Conecta varios servidores a un espacio compartido que sigue abierto entre conversaciones.

    - :pin: **Crear:** `/hub create` - crea tu propio hub
    - :compass: **Explorar:** `/hub browse` - encuentra hubs públicos
    - :link_icon: **Conectar:** `/hub connect` - únete a un hub existente
    - ⚙️ **Gestionar:** `/hub manage` - abre los ajustes de tu hub
    > Usa `/help` para ver todos los comandos.

  closing: |
    **¿Listo para conocer otro servidor? Prueba una llamada, descubre un hub o crea el tuyo aquí abajo.**

    -# Hecho con :heart: por Sidequest Labs

