rules:
  title: Reglas de InterChat
  body: Estas reglas se aplican en cualquier lugar donde uses InterChat, tanto en hubs como en llamadas.
  tabs:
    short: Las reglas
    full: Normas completas
    moderation: Moderación
  short: |-
    > **1.** Trata a las personas con respeto. Si alguien dice que pares, para.
    > **2.** No ataques a nadie por lo que es. Nada de insultos discriminatorios.
    > **3.** Nada de amenazas, y no compartas información privada.
    > **4.** Nada de contenido sexual. Nunca con menores.
    > **5.** Nada de spam, y no arruines la conversación.
    > **6.** No evadas bloqueos ni envíes denuncias falsas.
    > **7.** Los nombres también deben cumplir estas reglas.
  rules:
    title: Las reglas
    commonSense: |
      ## Usa el sentido común
      Estas reglas no pueden cubrir todas las situaciones posibles.

      Si algo se hace claramente para hacer daño, amenazar, acosar, sexualizar o alterar gravemente a otra persona, no asumas que está permitido solo porque no encuentres la redacción exacta en estas reglas.
    body: |
      ### 1. Trata a las personas con respeto
      **Las bromas están permitidas. El acoso no.**
      - Bromear y vacilar está bien, pero no lo conviertas en insultos repetidos, acoso ni intentos deliberados de molestar a alguien.
      - Si alguien te pide que pares, **para**.
      - No provoques, te burles ni ataques a alguien repetidamente, sobre todo después de que te haya pedido que pares.
      ### 2. No ataques a nadie por lo que es
      **No se permite el fanatismo.**
      - No ataques, insultes ni degrades a alguien por su raza, etnia, nacionalidad, religión, género, sexualidad, discapacidad o rasgos similares.
      - No se permiten los insultos discriminatorios, aunque afirmes que puedes usarlos porque se aplican a ti.
      ### 3. Mantén a las personas a salvo
      **Nada de amenazas ni conductas peligrosas.**
      - No amenaces con herir, matar o agredir sexualmente a alguien.
      - No animes a nadie a hacerse daño.
      - No animes ni ayudes a nadie a hacer doxing, swatting, atacar o dañar de cualquier otra forma a otra persona.

      **No compartas información privada.**
      - No publiques ni amenaces con publicar la dirección, el teléfono, el nombre real, la ubicación, la dirección IP u otra información privada de alguien.
      ### 4. Mantén apropiado el contenido sexual
      **No sexualices a menores.**
      - No se permiten chistes, historias, comentarios ni conversaciones sexuales que involucren a menores.
      - El grooming, intentar obtener contenido sexual de un menor u otras conductas sexuales dirigidas a menores se tratan con especial gravedad.

      **Mantén el contenido sexual explícito fuera de InterChat.**
      - Nada de sexting, rol sexual, mensajes sexuales gráficos ni contenido similar.
      - Coquetear está bien cuando es bienvenido. Si alguien no está interesado, **para**.
      ### 5. No arruines la conversación
      **Nada de spam ni interrupciones deliberadas.**
      - No inundes los chats, no envíes enormes muros de texto, no hagas spam de mensajes o emojis ni inutilices a propósito una conversación.
      ### 6. No interfieras con la moderación
      **No evadas la moderación.**
      - No uses otra cuenta ni otro método para saltarte un bloqueo o restricción activos.

      **No abuses del sistema de denuncias.**
      - Las denuncias deben ser honestas y hacerse de buena fe.
      - No hagas denuncias falsas para que castiguen a alguien.
      ### 7. Mantén apropiada tu identidad
      **Los nombres también deben cumplir las reglas.**
      - Los nombres de usuario, apodos, nombres de servidor y otros nombres mostrados a través de InterChat deben cumplir estas reglas.

  enforcement: |
    ## Cómo funciona la moderación
    Los moderadores consideran **qué pasó, cuán grave fue, si fue intencionado, contra quién iba dirigido, si la persona paró cuando se lo pidieron y su historial reciente.**
    ### La escalera de sanciones es:
    ```Aviso → 6h → 24h → 7d → 14d → 30d → Permanente```
    *Las sanciones no siempre son lineales y a menudo dependen de la gravedad y el contexto de la infracción. Las infracciones normales de más de 90 días deberían caducar automáticamente por lo general y no aumentar una sanción.*

