rules:
  title: Aturan InterChat
  body: Aturan ini berlaku di mana pun kamu memakai InterChat, baik di hub maupun panggilan.
  tabs:
    short: Aturannya
    full: Pedoman lengkap
    moderation: Moderasi
  short: |-
    > **1.** Perlakukan orang dengan hormat. Jika seseorang bilang berhenti, berhentilah.
    > **2.** Jangan menyerang orang karena jati dirinya. Tidak ada hinaan.
    > **3.** Tidak ada ancaman, dan jangan bagikan informasi pribadi.
    > **4.** Tidak ada konten seksual. Tidak pernah melibatkan anak di bawah umur.
    > **5.** Tidak ada spam, dan jangan rusak percakapan.
    > **6.** Jangan menghindari ban atau mengirim laporan palsu.
    > **7.** Nama juga harus mengikuti aturan ini.
  rules:
    title: Aturannya
    commonSense: |
      ## Gunakan akal sehat
      Aturan ini tidak bisa mencakup setiap situasi yang mungkin.

      Jika sesuatu jelas dilakukan untuk menyakiti, mengancam, melecehkan, menyeksualisasi, atau mengganggu orang lain secara serius, jangan anggap itu diperbolehkan hanya karena kamu tidak menemukan kata-kata persisnya di aturan ini.
    body: |
      ### 1. Perlakukan orang dengan hormat
      **Bercanda boleh. Pelecehan tidak.**
      - Bercanda dan saling ledek tidak masalah, tetapi jangan mengubahnya menjadi hinaan berulang, pelecehan, atau upaya sengaja membuat seseorang kesal.
      - Jika seseorang memintamu berhenti, **berhentilah**.
      - Jangan berulang kali memprovokasi, mengejek, atau menyerang seseorang, terutama setelah dia memintamu berhenti.
      ### 2. Jangan menyerang orang karena jati dirinya
      **Fanatisme tidak diperbolehkan.**
      - Jangan menyerang, menghina, atau merendahkan seseorang karena ras, etnis, kebangsaan, agama, gender, seksualitas, disabilitas, atau ciri serupa.
      - Hinaan tidak diperbolehkan, bahkan jika kamu mengaku boleh memakainya karena berlaku untukmu.
      ### 3. Jaga keselamatan orang
      **Tidak ada ancaman atau perilaku berbahaya.**
      - Jangan mengancam akan melukai, membunuh, atau menyerang seseorang secara seksual.
      - Jangan mendorong seseorang untuk menyakiti dirinya sendiri.
      - Jangan mendorong atau membantu seseorang melakukan doxing, swatting, menyerang, atau mencelakai orang lain dengan cara apa pun.

      **Jangan bagikan informasi pribadi.**
      - Jangan memposting atau mengancam akan memposting alamat, nomor telepon, nama asli, lokasi, alamat IP, atau informasi pribadi lain milik seseorang.
      ### 4. Jaga konten seksual tetap pantas
      **Jangan menyeksualisasi anak di bawah umur.**
      - Lelucon, cerita, komentar, atau percakapan seksual yang melibatkan anak di bawah umur tidak diperbolehkan.
      - Grooming, upaya mendapatkan konten seksual dari anak di bawah umur, atau perilaku seksual lain yang ditujukan kepada anak di bawah umur ditangani dengan sangat serius.

      **Jauhkan konten seksual eksplisit dari InterChat.**
      - Tidak ada sexting, roleplay seksual, pesan seksual vulgar, atau konten serupa.
      - Flirting boleh jika diterima. Jika seseorang tidak tertarik, **berhentilah**.
      ### 5. Jangan rusak percakapan
      **Tidak ada spam atau gangguan yang disengaja.**
      - Jangan membanjiri obrolan, mengirim tembok teks yang sangat panjang, men-spam pesan atau emoji, atau sengaja membuat percakapan tidak bisa dipakai.
      ### 6. Jangan menghalangi moderasi
      **Jangan menghindari moderasi.**
      - Jangan memakai akun lain atau cara lain untuk menghindari ban atau pembatasan yang sedang berlaku.

      **Jangan menyalahgunakan sistem laporan.**
      - Laporan harus jujur dan dibuat dengan itikad baik.
      - Jangan membuat laporan palsu agar seseorang dihukum.
      ### 7. Jaga identitasmu tetap pantas
      **Nama juga harus mengikuti aturan.**
      - Nama pengguna, nama panggilan, nama server, dan nama lain yang ditampilkan lewat InterChat harus mengikuti aturan ini.

  enforcement: |
    ## Cara kerja moderasi
    Moderator melihat **apa yang terjadi, seberapa serius, apakah disengaja, siapa yang menjadi sasaran, apakah orangnya berhenti saat diminta, dan riwayat terbarunya.**
    ### Tangga hukumannya adalah:
    ```Peringatan → 6h → 24h → 7d → 14d → 30d → Permanen```
    *Hukuman tidak selalu berurutan dan sering bergantung pada tingkat keparahan dan konteks pelanggaran. Pelanggaran biasa yang lebih dari 90 hari umumnya akan kedaluwarsa otomatis dan tidak menambah hukuman.*

