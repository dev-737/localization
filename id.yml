about:
  title: Tentang InterChat
  tagline: Server, terhubung.
  description: |-
    InterChat menghubungkan server-server Discord, sehingga orang dari server berbeda bisa saling mengobrol.

    **Hub** adalah kanal bersama tempat banyak server mengirim pesan. Obrolannya tidak pernah sepi.

    **Panggilan** menghubungkanmu secara privat dengan satu orang lain, selama kalian berdua mau.
  examples: |-
    > **/call**: ngobrol dengan orang baru sekarang juga
    > **/hub directory**: gabung ke hub dan ngobrol dengan banyak server

  closingText: Dibuat oleh tim InterChat.
  buttons:
    shardInfo: Info shard

botLanding:
  title: 'Servermu, terhubung. :globe_icon: Ayo lintas server!'
  description: |
    Hai, aku InterChat. Aku menghubungkan server ini dengan percakapan di seluruh Discord.

    ## 📞 Panggilan 1:1 dan panggilan grup
    Mulai panggilan dan terhubung dengan server lain dalam hitungan detik. Panggilan grup mempertemukan beberapa server dalam satu percakapan.

    Gunakan `/call`, `/skip`, dan `/hangup`. Setiap panggilan bisa membawamu naik di `/leaderboard`. 😎
  hubs: |
    ## :house_icon: Hub
    Hub adalah komunitas **lintas server** yang permanen. Hubungkan beberapa server ke satu ruang bersama yang tetap terbuka di antara percakapan.

    - :pin: **Buat:** `/hub create` - buat hubmu sendiri
    - :compass: **Jelajahi:** `/hub browse` - temukan hub publik
    - :link_icon: **Hubungkan:** `/hub connect` - gabung ke hub yang sudah ada
    - ⚙️ **Kelola:** `/hub manage` - buka pengaturan hubmu
    > Gunakan `/help` untuk melihat semua perintah.

  closing: |
    **Siap bertemu server lain? Coba panggilan, temukan hub, atau buat hubmu sendiri di bawah.**

    -# Dibuat dengan :heart: oleh Sidequest Labs

